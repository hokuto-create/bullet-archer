<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BULLET ARCHER 〜弾幕の射手〜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a14;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
  }
  #game-canvas { display: block; width: 100%; height: 100%; }

  /* ---- HUD ---- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(10px + env(safe-area-inset-top)) 16px 0;
    pointer-events: none; display: none;
  }
  #hud-row { display: flex; justify-content: space-between; align-items: flex-start; }
  #hud-right { text-align: right; text-shadow: 0 1px 3px #000; }
  #chapter-label { font-size: 11px; color: #9fc4ff; letter-spacing: 0.08em; }
  #wave-label { font-size: 18px; font-weight: bold; color: #ffd76a; }
  #score-label { font-size: 14px; color: #ccc; }
  /* HPゲージ本体はキャラの頭上(3D側)に出す。HUD には数値だけ残す */
  #hp-label { font-size: 11px; color: #cfc; text-shadow: 0 1px 2px #000; }

  /* ---- グレイズゲージ(HPバーの下)---- */
  #graze-bar-outer {
    width: min(46vw, 260px); height: 10px; margin-top: 6px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 5px; overflow: hidden;
  }
  #graze-bar-inner {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #2b8fd6, #7fd8ff);
    transition: width 0.12s;
  }
  /* チャージあり(次の攻撃が強化される)は金色に点滅 */
  #graze-bar-inner.full {
    background: linear-gradient(90deg, #f0a830, #fff0bb);
    animation: graze-full 0.55s ease-in-out infinite;
  }
  @keyframes graze-full { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  #graze-label { font-size: 11px; color: #bcdcf5; margin-top: 2px; text-shadow: 0 1px 2px #000; }
  #graze-label.full { color: #ffd76a; font-weight: bold; }

  /* ---- 経験値バー(グレイズゲージの下)---- */
  #exp-bar-outer {
    width: min(46vw, 260px); height: 8px; margin-top: 6px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 4px; overflow: hidden;
  }
  #exp-bar-inner {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #7ae05f, #c8f77a);
    transition: width 0.12s;
  }
  #exp-label { font-size: 11px; color: #cdf0bc; margin-top: 2px; text-shadow: 0 1px 2px #000; }

  /* ---- レベルアップ(スキル3択)画面 ---- */
  #levelup-screen {
    position: fixed; inset: 0; z-index: 9;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(6,8,18,0.72);
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }
  /* 出現演出: 画面が display:none → flex になるとアニメーションが再生される。
     連続レベルアップ中は画面が出っぱなしなのでタイトルは再生されず、
     カード(毎回作り直す)だけが跳ね直す */
  #levelup-title {
    font-size: clamp(28px, 7vw, 46px); font-weight: 900;
    color: #b6ff7a; letter-spacing: 0.08em;
    text-shadow: 0 0 22px rgba(140,255,80,0.55);
    animation: title-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  @keyframes title-in {
    from { opacity: 0; transform: scale(2.4); }
    to { opacity: 1; transform: scale(1); }
  }
  #levelup-sub {
    font-size: 14px; color: #cde; margin: 8px 0 26px;
    animation: fade-in 0.35s ease 0.18s backwards;
  }
  @keyframes fade-in { from { opacity: 0; } }
  /* 3枚は必ず横一列。折り返さず、狭い画面では札と文字の方を縮める
     (grid の 1fr + min-width:0 + clamp。flex-wrap だと 2+1 に割れる) */
  #skill-cards {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(6px, 1.8vw, 14px);
    width: 100%; max-width: 720px;
  }
  .skill-card {
    min-width: 0;
    display: flex; flex-direction: column; align-items: center;
    background: linear-gradient(180deg, rgba(40,48,88,0.95), rgba(22,26,52,0.95));
    /* --rc はカード生成時に CONFIG.level.rarity の色が入る */
    border: 2px solid var(--rc, rgba(160,190,255,0.45));
    border-radius: 14px;
    padding: clamp(10px, 2.6vw, 16px) clamp(6px, 1.6vw, 12px);
    color: #fff; text-align: center; cursor: pointer;
    font-family: inherit;
  }
  .skill-card:active { transform: scale(0.96); }
  /* 1枚ずつ下から跳ねて出る。--in-delay はカード生成時に入る(レア度が高い
     札ほど溜めが長い。openLevelUp() 参照)。backwards で遅延中は透明のまま */
  .skill-card {
    animation: card-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    animation-delay: var(--in-delay, 0s);
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(46px) scale(0.7); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .skill-card .s-rarity {
    font-size: clamp(9px, 2.4vw, 11px); font-weight: bold;
    color: var(--rc, #b8c4d0); letter-spacing: 0.12em;
    margin-bottom: 4px;
  }
  /* レア以上を引いた回の昇格演出: カードが出る前に光球が段の色を
     低い方から順に纏って弾み(--tc は JS が段の色を流し込む)、
     引いた段の色で大きくバーストする。段が高いほど昇格回数が増えて溜めになる */
  #rarity-tease {
    position: absolute; left: 50%; top: 50%;
    width: 120px; height: 120px; margin: -60px 0 0 -60px;
    border-radius: 50%; pointer-events: none; display: none;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, var(--tc, #fff) 40%, transparent 70%);
  }
  #rarity-tease.step { animation: tease-pop 0.5s ease; }
  @keyframes tease-pop {
    from { transform: scale(0.4); opacity: 0.55; }
    60% { transform: scale(1.2); opacity: 1; }
    to { transform: scale(1); opacity: 0.95; }
  }
  #rarity-tease.final { animation: tease-burst 0.55s ease-out forwards; }
  @keyframes tease-burst {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(3.4); opacity: 0; }
  }

  /* エピック以上は枠を淡く明滅させて「引き」の強さを見せる。
     animation はショートハンドで card-in を上書きしてしまうため、
     出現アニメもここに並記する(delay も2本ぶん指定) */
  .rarity-epic, .rarity-legendary {
    animation: card-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards,
               rarity-glow 1.2s ease-in-out infinite;
    animation-delay: var(--in-delay, 0s), var(--in-delay, 0s);
  }
  @keyframes rarity-glow {
    0%, 100% { box-shadow: 0 0 8px var(--rc); }
    50% { box-shadow: 0 0 24px var(--rc); }
  }
  .skill-card .s-icon { font-size: clamp(24px, 6.4vw, 34px); line-height: 1.2; }
  .skill-card .s-name {
    font-size: clamp(12px, 3.4vw, 15px); font-weight: bold; color: #ffd76a;
    margin: 8px 0 6px; line-height: 1.3;
  }
  /* 説明は長さがまちまちなので、伸びる側をここにして Lv 行を下端に揃える */
  .skill-card .s-desc {
    font-size: clamp(10px, 2.8vw, 12px); color: #bcd; line-height: 1.6;
    min-height: 3.2em; flex: 1 1 auto;
  }
  .skill-card .s-lv {
    font-size: clamp(9px, 2.5vw, 11px); color: #9fe08a;
    margin-top: 6px; font-weight: bold;
  }

  #wave-banner {
    position: fixed; top: 30%; left: 0; right: 0;
    text-align: center; font-size: 34px; font-weight: bold;
    color: #ffd76a; text-shadow: 0 2px 12px rgba(255,180,0,0.6);
    pointer-events: none; opacity: 0; transition: opacity 0.4s;
  }

  /* ---- 仮想ジョイスティック ---- */
  #joystick {
    position: fixed; display: none; pointer-events: none; z-index: 5;
  }
  #joy-base {
    position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.3);
  }
  #joy-knob {
    position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
  }

  /* ---- タイトル / ゲームオーバー画面 ---- */
  .screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(20,24,48,0.92), rgba(5,6,12,0.97));
    text-align: center;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  #title-main {
    font-size: clamp(38px, 10vw, 72px);
    font-weight: 900; letter-spacing: 0.06em;
    color: #ffd76a;
    text-shadow: 0 0 24px rgba(255,150,0,0.55), 0 3px 0 #7a4a00;
  }
  #title-sub {
    font-size: clamp(16px, 4vw, 26px);
    color: #9fc4ff; letter-spacing: 0.3em;
    margin: 10px 0 40px;
  }
  .screen p.desc { color: #aab; font-size: 14px; line-height: 1.9; margin-bottom: 34px; }
  .btn {
    font-size: 20px; font-weight: bold;
    color: #10142a; background: linear-gradient(180deg, #ffd76a, #f0a830);
    border: none; border-radius: 999px;
    padding: 14px 58px; cursor: pointer;
    box-shadow: 0 4px 18px rgba(255,170,0,0.4);
  }
  .btn:active { transform: scale(0.96); }
  #gameover-screen { display: none; }
  #go-title { font-size: clamp(30px, 8vw, 54px); font-weight: 900; color: #ff5566; margin-bottom: 18px;
              text-shadow: 0 0 20px rgba(255,60,80,0.5); }
  #go-stats { font-size: 18px; color: #dde; line-height: 2; margin-bottom: 36px; }

  /* ---- チャプタークリア画面 ---- */
  #clear-screen { display: none; }
  #cc-title {
    font-size: clamp(30px, 8vw, 56px); font-weight: 900;
    color: #ffe89a; letter-spacing: 0.06em;
    text-shadow: 0 0 26px rgba(255,200,80,0.65), 0 3px 0 #7a5200;
  }
  #cc-sub { font-size: clamp(14px, 3.6vw, 20px); color: #9fc4ff; letter-spacing: 0.2em; margin: 12px 0 26px; }
  #cc-stats { font-size: 17px; color: #dde; line-height: 2; margin-bottom: 32px; }
  /* 続ける / タイトルへ の2ボタン。狭い画面では縦に積む */
  #cc-buttons { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  /* 副ボタンは金の主ボタンと張り合わないよう暗色に */
  .btn.sub {
    color: #dfe6ff; background: linear-gradient(180deg, #3a4470, #232a4c);
    box-shadow: 0 4px 18px rgba(0,0,0,0.45);
  }

  /* ---- タイトルのチャプター選択 ---- */
  #chapter-select {
    display: flex; flex-direction: column; gap: 12px;
    width: min(86vw, 340px);
  }
  .chapter-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-family: inherit; cursor: pointer;
    color: #10142a; background: linear-gradient(180deg, #ffd76a, #f0a830);
    border: none; border-radius: 16px; padding: 14px 20px;
    box-shadow: 0 4px 18px rgba(255,170,0,0.4);
  }
  .chapter-btn:active { transform: scale(0.97); }
  .chapter-btn .c-name { font-size: 20px; font-weight: 900; letter-spacing: 0.08em; }
  .chapter-btn .c-sub { font-size: 12px; }
  .chapter-btn.locked {
    color: #8892b0; background: linear-gradient(180deg, #2a3050, #1a2038);
    box-shadow: none; cursor: default;
  }
  .chapter-btn.locked:active { transform: none; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="hud">
  <div id="hud-row">
    <div>
      <div id="hp-label">HP 100 / 100</div>
      <div id="graze-bar-outer"><div id="graze-bar-inner"></div></div>
      <div id="graze-label">GRAZE で次の攻撃を強化</div>
      <div id="exp-bar-outer"><div id="exp-bar-inner"></div></div>
      <div id="exp-label">Lv 1</div>
    </div>
    <div id="hud-right">
      <div id="chapter-label">CHAPTER 1</div>
      <div id="wave-label">WAVE 1</div>
      <div id="score-label">SCORE 0</div>
    </div>
  </div>
</div>
<div id="wave-banner"></div>

<div id="joystick">
  <div id="joy-base"></div>
  <div id="joy-knob"></div>
</div>

<div id="levelup-screen">
  <div id="levelup-title">LEVEL UP!</div>
  <div id="levelup-sub">スキルを1つ選ぼう(キー: 1 / 2 / 3)</div>
  <div id="rarity-tease"></div>
  <div id="skill-cards"></div>
</div>

<div id="title-screen" class="screen">
  <div id="title-main">BULLET ARCHER</div>
  <div id="title-sub">〜弾幕の射手〜</div>
  <p class="desc">
    移動: WASD / 矢印キー / 仮想ジョイスティック<br>
    立ち止まると最寄りの敵を自動攻撃!<br>
    敵弾を<b>かすめる</b>(グレイズ)と次の攻撃が<b>2倍</b>に!<br>
    敵を倒して経験値ゲット!レベルアップでスキルを選ぼう<br>
    <b>全30ウェーブ</b>を勝ち抜けばチャプタークリア!次のチャプターが解放される
  </p>
  <div id="chapter-select"></div>
</div>

<div id="gameover-screen" class="screen">
  <div id="go-title">GAME OVER</div>
  <div id="go-stats"></div>
  <button id="retry-btn" class="btn">RETRY</button>
</div>

<div id="clear-screen" class="screen">
  <div id="cc-title">CHAPTER CLEAR!</div>
  <div id="cc-sub"></div>
  <div id="cc-stats"></div>
  <div id="cc-buttons">
    <button id="next-btn" class="btn">次のチャプターへ</button>
    <button id="endless-btn" class="btn sub">このまま続ける</button>
    <button id="totitle-btn" class="btn sub">タイトルへ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// =====================================================================
// 定数
// =====================================================================
const CONFIG = {
  arena: { half: 22 },              // アリーナ半径(移動可能範囲 ±half)
  player: {
    speed: 8.5,
    maxHp: 100,
    radius: 0.6,
    fireInterval: 0.38,             // オート攻撃間隔(秒)
    arrowSpeed: 26,
    arrowDamage: 12,
    hitInvincible: 0.5,             // 被弾後の無敵時間(秒)
    // 弓のモーション: 発射間隔(攻撃速度スキル込み)に同期して
    // 「弦を引く → 引き絞って狙いを溜める → 放つ → フォロースルー」を繰り返す
    bow: {
      drawPortion: 0.6,             // 発射間隔のうち弦を引くのに使う割合(残りは引き絞ったまま狙いを溜める)
      drawSmoothing: 16,            // 引きの追従の速さ(指数減衰の係数。大きいほどキビキビ)
      holdTremor: 0.02,             // 引き絞り中のわずかな震え(弦の張りつめを見せる。ラジアン)
      releaseTime: 0.16,            // 放った後のフォロースルー時間(秒)
      releaseSnap: 40,              // リリース時に弦(=引き手)が戻る速さ(指数減衰の係数)
      drawDepth: 0.35,              // 引き切りで弦を後ろへ引く距離(弓ローカル)。腕の実座標だと
                                    // デフォルメの短い腕でほぼ折れないので、引き量から直接決める
      stance: 0.85,                 // 構えの半身(左肩を敵へ向ける体の開き。ラジアン)
      recoil: 0.25,                 // 放った瞬間の弓手の跳ね上がり(ラジアン)
      recoilPitch: 0.3,             // リリース反動ののけぞり(ラジアン)
      recoilBack: 0.24,             // リリース反動で体が後ろへ持っていかれる距離
    },
    // 走りの土煙(足が地面を蹴るたびに出す。俯瞰では脚がほぼ見えないので、走っている感はこれで出す)
    dust: { count: 10, duration: 0.45, size: 0.28, opacity: 0.6, grow: 2.2, back: 0.45 },
  },
  wave: {
    baseCount: 4,                   // ウェーブ1の敵数
    countPerWave: 2,                // ウェーブごとの追加数
    maxCount: 30,                   // 同時スポーン数の上限(終盤が画面外の物量勝負にならないように)
    hpGrowth: 0.10,                 // 通常敵のHPがウェーブごとに増える割合(ボスは hpPerWave 側で伸ばす)
    bossEvery: 5,                   // 5ウェーブごとにボス
    clearHeal: 15,                  // ウェーブクリア時の回復量
    spawnMinDist: 10,               // プレイヤーからの最小スポーン距離
  },
  // チャプター定義(データ駆動: 増やすときはここにオブジェクトを足す)。
  // waves 本のウェーブを勝ち抜くと1チャプタークリアで、次のチャプターが解放される
  // (解放状況は localStorage に保存)。最終ウェーブは bossEvery の倍数にしておくと
  // ボス戦で締められる。enemy*Mul はそのチャプターの敵全体に掛かる難易度倍率
  chapters: [
    {
      waves: 30, name: 'CHAPTER 1', subtitle: '〜 始まりの荒野 〜',
      clearBonus: 5000,             // クリア時のスコアボーナス
      hpBonus: 20,                  // 残HP1につき加算するスコア(粘り勝ちを評価する)
      enemyHpMul: 1, enemySpeedMul: 1, bulletSpeedMul: 1,
      floorColor: 0x1a1f33, wallColor: 0x3355aa, wallEmissive: 0x112244,
    },
    {
      waves: 30, name: 'CHAPTER 2', subtitle: '〜 紅蓮の戦場 〜',
      clearBonus: 10000,
      hpBonus: 30,
      enemyHpMul: 1.6, enemySpeedMul: 1.15, bulletSpeedMul: 1.2,
      floorColor: 0x2c1520, wallColor: 0xaa3355, wallEmissive: 0x441122,
    },
  ],
  // グレイズ: 敵弾を「当たらないギリギリ」で通したときの判定と演出
  graze: {
    innerRadius: 0.55,              // これより内側はグレイズにしない(実際の被弾判定はこれより外なので下限として働く)
    outerRadius: 2,                 // ここまで近づいた弾がグレイズ成立
    rangeRingWidth: 0.06,           // 判定範囲リング(outerRadius に沿って常時表示)の線の太さ
    rangeRingOpacity: 0.16,         // 同リングの普段の濃さ(視界の邪魔にならない薄さに)
    rangeRingFlashOpacity: 0.55,    // グレイズ成立の瞬間の濃さ
    rangeRingFlashDuration: 0.3,    // 成立後、普段の濃さへ戻るまでの時間(秒)
    chargeMax: 3,                   // ためておけるチャージ数の上限(グレイズ1回 = チャージ1)
    damageMul: 2,                   // チャージ消費時の攻撃倍率(次の攻撃1回ぶんが丸ごと2倍)
    fxCount: 12,                    // 同時に出せる白リングの数
    fxDuration: 0.24,               // 白リングの表示時間(秒)
    fxStartScale: 1.25,             // リングの初期・最終倍率(リング半径 0.7 に掛かる)。
    fxEndScale: 1.8,                // 足元リング(0.66)より外から outerRadius 付近まで広がる大きさ
  },
  // レベル・スキル: 敵を倒すと経験値、レベルアップでスキル3択(アーチャー伝説方式)
  level: {
    baseExp: 30,                    // Lv1→2 に必要な経験値
    expGrowth: 1.35,                // レベルごとの必要経験値の倍率
    choices: 3,                     // レベルアップで提示するスキル数
    spread: 0.16,                   // マルチショットの矢同士の角度(ラジアン)
    // スキルのレアリティ(4段階)。3択の各枠は「重みで段を引く → その段の
    // 未MAXスキルから1つ選ぶ」2段抽選。候補が残っていない段は抽選から外して
    // 重みを再配分するので、段が空でも壊れない(legendary は当面スキルなしでよい)

// =====================================================================
// 弾幕パターン定義(データ駆動: パターンを増やすときはここに追加する)
// 各関数は「発射する弾の方向ベクトル配列」を返す
// =====================================================================
const BULLET_PATTERNS = {
  // プレイヤー狙い単発
  aimed(enemy, playerPos) {
    const d = new THREE.Vector3().subVectors(playerPos, enemy.mesh.position);
    d.y = 0; d.normalize();
    return [d];
  },
  // 全方位弾幕
  radial(enemy) {
    const dirs = [];
    const n = enemy.def.attack.count;
    const offset = Math.random() * Math.PI * 2;
    for (let i = 0; i < n; i++) {
      const a = offset + (i / n) * Math.PI * 2;
      dirs.push(new THREE.Vector3(Math.cos(a), 0, Math.sin(a)));
    }
    return dirs;
  },
};

// 「プレイヤー中心 visibleRadius の円が必ず画面内に入る」よう平行投影の画角を決める。
// 見下ろしているぶん地面は画面縦方向に sin(pitch) 倍に潰れて写るので、
// 縦は必要量を sin(pitch) 倍しておく。縦長画面では左右がいちばん狭くなる。
function updateCameraProjection() {
  const c = CONFIG.camera;
  const aspect = window.innerWidth / window.innerHeight;
  const R = c.visibleRadius;
  const pitch = Math.atan2(c.offset.y, Math.hypot(c.offset.x, c.offset.z));

  const halfH = Math.max(R / aspect, R * Math.sin(pitch));
  const halfW = halfH * aspect;
  camera.left = -halfW; camera.right = halfW;
  camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
}

window.addEventListener('resize', () => {
  updateCameraProjection();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// プレイヤーは +Z が正面(rotation.y / lookAt がその向きを作る)
// 頭が大きい 2 頭身のデフォルメ体型。角ばらないよう球・カプセル・トーラスだけで組む
(function buildPlayer() {
  const P = {};
  const group = new THREE.Group();

  // セル調の陰影(4 段グラデーション)。主人公だけトゥーンにして敵と質感を分ける
  // RedFormat は WebGL1 で使えないので RGBA で作る
  const shades = [120, 178, 226, 255];
  const ramp = new Uint8Array(shades.length * 4);
  shades.forEach((v, i) => {
    ramp[i * 4] = ramp[i * 4 + 1] = ramp[i * 4 + 2] = v;
    ramp[i * 4 + 3] = 255;
  });
  const gradientMap = new THREE.DataTexture(ramp, shades.length, 1, THREE.RGBAFormat);
  gradientMap.minFilter = THREE.NearestFilter;
  gradientMap.magFilter = THREE.NearestFilter;
  gradientMap.generateMipmaps = false;
  gradientMap.needsUpdate = true;
  const toon = (color) => new THREE.MeshToonMaterial({ color, gradientMap });

  const matHair = toon(HERO.hair);
  const matSkin = toon(HERO.skin);
  const matArmor = toon(HERO.armor);
  const matShade = toon(HERO.leather);
  const matGold = toon(HERO.gold);
  const matCloth = toon(HERO.cloth);
  const matTabard = toon(HERO.tabard);
  const matCape = toon(HERO.cape);
  matCape.side = THREE.DoubleSide;
  const matBow = toon(HERO.bow);
  const matBrow = toon(HERO.brow);
  const matMouth = toon(HERO.mouth);
  const matEye = new THREE.MeshBasicMaterial({ color: HERO.eye });
  const matWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });

  const put = (geo, mat, x, y, z) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    return m;
  };
  const ball = (r, seg) => new THREE.SphereGeometry(r, seg || 16, Math.round((seg || 16) * 0.75));
  // r128 に CapsuleGeometry が無いので、輪郭を回して丸い棒を作る
  function capsule(r, len, seg) {
    seg = seg || 5;
    const pts = [];
    for (let i = 0; i <= seg; i++) {
      const a = (i / seg) * (Math.PI / 2);
      pts.push(new THREE.Vector2(Math.sin(a) * r, -len / 2 - Math.cos(a) * r));
    }
    for (let i = 0; i <= seg; i++) {
      const a = (i / seg) * (Math.PI / 2);
      pts.push(new THREE.Vector2(Math.cos(a) * r, len / 2 + Math.sin(a) * r));
    }
    return new THREE.LatheGeometry(pts, 12);
  }

  // 足元の影と発光リング(俯瞰視点で自機位置を掴みやすくする)
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.52, 20),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  group.add(shadow);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.56, 0.66, 32, 1, 0, Math.PI * 1.7),
    new THREE.MeshBasicMaterial({
      color: 0xbcd4ff, transparent: true, opacity: 0.28, side: THREE.DoubleSide,
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.03;
  group.add(ring);
  P.ring = ring;

  // グレイズ判定範囲のリング(半径 = CONFIG.graze.outerRadius)。
  // 普段は薄く敷いておき、グレイズ成立の瞬間だけ updatePlayerAnimation() が明るくする
  const gz = CONFIG.graze;
  const grazeRing = new THREE.Mesh(
    new THREE.RingGeometry(gz.outerRadius - gz.rangeRingWidth, gz.outerRadius, 48),
    new THREE.MeshBasicMaterial({
      color: 0x9fd8ff, transparent: true, opacity: gz.rangeRingOpacity,
      side: THREE.DoubleSide, depthWrite: false,
    })
  );
  grazeRing.rotation.x = -Math.PI / 2;
  grazeRing.position.y = 0.025;
  group.add(grazeRing);
  P.grazeRing = grazeRing;

  // 上下動・前傾を受け持つルート
  const root = new THREE.Group();
  group.add(root);
  P.root = root;

  // ---- 脚(side: -1 左 / +1 右)----
  function buildLeg(side) {
    const hip = new THREE.Group();
    hip.position.set(0.13 * side, 0.5, 0);
    root.add(hip);
    hip.add(put(capsule(0.105, 0.14), matCloth, 0, -0.12, 0));        // 腿
    const knee = new THREE.Group();
    knee.position.y = -0.24;
    hip.add(knee);
    knee.add(put(capsule(0.095, 0.1), matCloth, 0, -0.07, 0));        // すね
    const boot = put(ball(0.155), matArmor, 0, -0.15, 0.03);          // 丸いブーツ
    boot.scale.set(1, 0.78, 1.2);
    knee.add(boot);
    const cuff = put(new THREE.TorusGeometry(0.1, 0.035, 6, 14), matGold, 0, -0.05, 0);
    cuff.rotation.x = Math.PI / 2;                                    // 足首の金リング
    knee.add(cuff);
    return { hip, knee };
  }
  P.legL = buildLeg(-1);
  P.legR = buildLeg(1);

  // ---- 胴(丸い樽型)----
  const torso = new THREE.Group();
  torso.position.y = 0.5;
  root.add(torso);
  P.torso = torso;

  torso.add(put(new THREE.CylinderGeometry(0.25, 0.31, 0.2, 16), matShade, 0, 0.09, 0)); // 腰
  const belt = put(new THREE.TorusGeometry(0.26, 0.04, 6, 18), matGold, 0, 0.19, 0);
  belt.rotation.x = Math.PI / 2;
  torso.add(belt);
  const chest = put(ball(0.3), matArmor, 0, 0.36, 0);
  chest.scale.set(1.06, 1.0, 0.9);
  torso.add(chest);
  // 胸の青いタバード(白装甲だけだと頭と同化するので面を分ける)
  const tabard = new THREE.Mesh(
    new THREE.SphereGeometry(0.305, 16, 12, Math.PI / 2 - 0.6, 1.2, 0.5, 1.25), matTabard
  );
  tabard.position.set(0, 0.36, 0);
  tabard.scale.set(1.06, 1.0, 0.92);
  torso.add(tabard);
  const collar = put(new THREE.TorusGeometry(0.21, 0.045, 6, 18), matGold, 0, 0.52, 0);
  collar.rotation.x = Math.PI / 2 + 0.12;
  torso.add(collar);
  const badge = put(new THREE.TorusGeometry(0.055, 0.02, 6, 14), matGold, 0, 0.4, 0.27); // 胸章
  badge.scale.set(1, 1.15, 0.6);
  torso.add(badge);

  // 背中の矢筒
  const quiver = put(new THREE.CylinderGeometry(0.085, 0.075, 0.42, 10), matShade, -0.19, 0.42, -0.2);
  quiver.rotation.set(0.28, 0, -0.35);
  torso.add(quiver);
  for (let i = 0; i < 3; i++) {
    const f = put(new THREE.ConeGeometry(0.045, 0.14, 5), matTabard, -0.24 + i * 0.04, 0.68, -0.23);
    f.rotation.set(0.28, 0, -0.35);
    torso.add(f);                                                    // 矢羽根
  }

  // ---- 腕(左手に弓、右手で弦を引く)----
  function buildArm(side) {
    const shoulder = new THREE.Group();
    shoulder.position.set(0.29 * side, 0.42, 0);
    torso.add(shoulder);
    // 丸い肩パッド: 俯瞰でいちばん目立つので金の縁を回す
    const pad = put(ball(0.165), matArmor, 0.03 * side, 0.03, 0);
    pad.scale.set(1.05, 0.95, 1.05);
    shoulder.add(pad);
    const rim = put(new THREE.TorusGeometry(0.15, 0.032, 6, 16), matGold, 0.03 * side, -0.02, 0);
    rim.rotation.x = Math.PI / 2;
    shoulder.add(rim);
    shoulder.add(put(capsule(0.072, 0.08), matSkin, 0, -0.15, 0));    // 上腕
    const elbow = new THREE.Group();
    elbow.position.y = -0.24;
    shoulder.add(elbow);
    elbow.add(put(capsule(0.078, 0.07), matShade, 0, -0.09, 0));      // 前腕(グローブ)
    const hand = new THREE.Group();
    hand.position.y = -0.22;
    elbow.add(hand);
    const mitten = put(ball(0.095, 12), matShade, 0, 0, 0.01);        // ミトンの手
    mitten.scale.set(0.95, 1.05, 1.1);
    hand.add(mitten);
    return { shoulder, elbow, hand };
  }
  P.armL = buildArm(-1);
  P.armR = buildArm(1);

  // ---- 弓(左手に保持。弧の中心が +Z=正面、弦は手前側)----
  (function buildBow(hand) {
    const R = 0.3, arc = Math.PI * 1.15;
    // pivot は毎フレーム姿勢を打ち消して弓を常に正面・直立に保つ(下の updateBowPose)
    const pivot = new THREE.Group();
    hand.add(pivot);
    const bow = new THREE.Group();
    bow.position.set(0, -0.02, -(R - 0.11));   // グリップあたりが手に来る位置へ後ろ倒し
    pivot.add(bow);
    P.bowPivot = pivot;

    const ring = new THREE.Mesh(new THREE.TorusGeometry(R, 0.032, 8, 26, arc), matBow);
    ring.rotation.z = -arc / 2;                // 弧の中心を +X へ
    const holder = new THREE.Group();
    holder.rotation.y = -Math.PI / 2;          // その +X を +Z(正面)へ倒す
    holder.add(ring);
    bow.add(holder);
    bow.add(put(capsule(0.042, 0.13), matShade, 0, 0, R - 0.02));    // 革巻きのグリップ

    // 弦: 上下 2 本に分け、引き手の位置に合わせて V 字に折る
    const tipY = R * Math.sin(arc / 2), tipZ = R * Math.cos(arc / 2);
    const segGeo = new THREE.CylinderGeometry(0.009, 0.009, 1, 4);
    const strMat = new THREE.MeshBasicMaterial({ color: 0xe8e2cf });
    const up = new THREE.Mesh(segGeo, strMat);
    const dn = new THREE.Mesh(segGeo, strMat);
    bow.add(up, dn);

    // 番えた矢(引いている間だけ表示)。引き切りでも矢先が弓の前へ残る長さにする
    // (短いと引いたぶんだけ全体が後退し、俯瞰では大きな頭に隠れて見えなくなる)
    const nock = new THREE.Group();
    nock.add(put(new THREE.CylinderGeometry(0.014, 0.014, 0.95, 6), matBow, 0, 0, 0));
    nock.add(put(new THREE.ConeGeometry(0.03, 0.09, 6), matArmor, 0, 0.515, 0));
    nock.rotation.x = Math.PI / 2;
    nock.visible = false;
    bow.add(nock);

    P.bow = bow;
    P.string = { up, dn, tipY, tipZ, nock };
  })(P.armL.hand);

  // ---- マント(背中を包む曲面を 3 節のヒンジで揺らす)----
  const capeArc = Math.PI * 0.78;
  const capeSpec = [[0.29, 0.33, 0.24], [0.33, 0.38, 0.24], [0.38, 0.4, 0.18]];
  P.cape = [];
  let capeParent = torso;
  capeSpec.forEach(([rTop, rBot, h], i) => {
    const seg = new THREE.Group();
    seg.position.set(0, i === 0 ? 0.55 : -capeSpec[i - 1][2], 0);
    capeParent.add(seg);
    const cloth = put(
      new THREE.CylinderGeometry(rTop, rBot, h, 14, 1, true, Math.PI - capeArc / 2, capeArc),
      matCape, 0, -h / 2, 0
    );
    seg.add(cloth);
    if (i === capeSpec.length - 1) {                                  // 裾の金縁
      const hem = put(
        new THREE.TorusGeometry(rBot, 0.022, 6, 18, capeArc), matGold, 0, -h, 0
      );
      hem.rotation.set(Math.PI / 2, 0, -Math.PI / 2 - capeArc / 2);
      seg.add(hem);
    }
    P.cape.push(seg);
    capeParent = seg;
  });
  // 肩の留め具
  torso.add(put(ball(0.055, 10), matGold, -0.19, 0.55, -0.04));
  torso.add(put(ball(0.055, 10), matGold, 0.19, 0.55, -0.04));

  // ---- 頭部(体と同じくらい大きい)----
  const head = new THREE.Group();
  head.position.y = 0.86;
  torso.add(head);
  P.head = head;

  const face = put(ball(0.4, 20), matSkin, 0, 0, 0);
  face.scale.set(1, 0.97, 0.95);
  head.add(face);

  // 耳
  for (const side of [-1, 1]) {
    const ear = put(ball(0.075, 10), matSkin, 0.38 * side, -0.02, -0.02);
    ear.scale.set(0.55, 1.15, 0.85);
    head.add(ear);
  }

  // 目(大きめの黒目 + ハイライト)と眉・口
  for (const side of [-1, 1]) {
    const eye = put(ball(0.082, 12), matEye, 0.15 * side, 0.0, 0.345);
    eye.scale.set(0.8, 1.2, 0.45);
    head.add(eye);
    const shine = put(ball(0.03, 8), matWhite, 0.15 * side + 0.028, 0.055, 0.365);
    shine.scale.set(1, 1, 0.45);
    head.add(shine);
    const brow = put(capsule(0.018, 0.08), matBrow, 0.155 * side, 0.13, 0.35);
    brow.rotation.set(0, 0, Math.PI / 2 + 0.22 * side);                // 少し吊り目気味に
    brow.scale.set(1, 1, 0.5);
    head.add(brow);
  }
  const mouth = put(ball(0.045, 10), matMouth, 0, -0.14, 0.375);
  mouth.scale.set(1.1, 0.5, 0.35);
  head.add(mouth);

  // 髪: 顔の部分(正面 100 度)だけ開けた球殻をかぶせる
  const faceGap = 0.9;
  const hairCap = new THREE.Mesh(
    new THREE.SphereGeometry(
      0.415, 22, 14, Math.PI / 2 + faceGap, Math.PI * 2 - faceGap * 2, 0, Math.PI * 0.62
    ), matHair
  );
  hairCap.position.set(0, 0.01, -0.02);
  hairCap.scale.set(1.02, 1.06, 1.04);
  head.add(hairCap);
  // 前髪: 長さの違う房を額に垂らす([x, y, z, 太さ, 長さ, 傾き])
  [[-0.25, 0.16, 0.26, 0.08, 0.26, -0.7], [-0.13, 0.23, 0.32, 0.09, 0.3, -0.3],
   [0.02, 0.25, 0.34, 0.08, 0.24, 0.05], [0.15, 0.23, 0.32, 0.09, 0.3, 0.35],
   [0.26, 0.15, 0.25, 0.075, 0.24, 0.75]].forEach(([x, y, z, r, len, rz]) => {
    const bang = put(new THREE.ConeGeometry(r, len, 7), matHair, x, y, z);
    bang.rotation.set(-0.45, 0, Math.PI + rz);                         // 先を下に向ける
    head.add(bang);
  });
  // もみあげ・襟足
  for (const side of [-1, 1]) {
    const lock = put(new THREE.ConeGeometry(0.075, 0.3, 7), matHair, 0.33 * side, 0.02, 0.06);
    lock.rotation.set(-0.15, 0, Math.PI + 0.25 * side);
    head.add(lock);
  }
  const backHair = put(ball(0.31, 14), matHair, 0, -0.05, -0.15);
  backHair.scale.set(1.02, 0.9, 0.85);
  head.add(backHair);
  const tail = put(new THREE.ConeGeometry(0.11, 0.3, 8), matHair, 0, -0.26, -0.28);
  tail.rotation.set(Math.PI - 0.5, 0, 0);                              // 襟足のはね
  head.add(tail);

  // 金のサークレット(前面に小さな飾り)
  const circlet = put(new THREE.TorusGeometry(0.38, 0.022, 6, 22), matGold, 0, 0.13, -0.01);
  circlet.rotation.set(Math.PI / 2 - 0.12, 0, 0);
  circlet.scale.set(1.02, 1, 1.02);
  head.add(circlet);
  const crest = put(new THREE.ConeGeometry(0.05, 0.1, 6), matGold, 0, 0.22, 0.34);
  crest.rotation.x = -0.35;
  head.add(crest);

  scene.add(group);
  player.mesh = group;
  player.parts = P;
})();

// 弓の姿勢: 腕の振りをキャンセルし、常に「直立・キャラの正面向き」に保つ。
// 弓はローカルで +Z が射出方向なので、これで見た目の向きと矢の飛ぶ向きが一致する。
const _qHand = new THREE.Quaternion();
const _qBody = new THREE.Quaternion();
const _qTilt = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, 0.14));
function updateBowPose() {
  const pivot = player.parts.bowPivot;
  pivot.parent.getWorldQuaternion(_qHand);
  player.mesh.getWorldQuaternion(_qBody);
  pivot.quaternion.copy(_qHand).invert().multiply(_qBody).multiply(_qTilt);
}

// 弦と番え矢: 横ずれ(x/y)は引き手(右手)の実座標に寄せて腕と繋がって見せる。
// 引きの深さ(z)だけは引き量 A.draw から直接決める — デフォルメの短い腕では
// 手の実座標の後退が 0.01 ユニット程度しかなく、弦がほぼ張ったままに見えるため
const _nock = new THREE.Vector3();
const _seg = new THREE.Vector3();
const _axisY = new THREE.Vector3(0, 1, 0);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
function updateBowString() {
  const P = player.parts, s = P.string, bow = P.bow;
  bow.updateWorldMatrix(true, false);
  P.armR.hand.getWorldPosition(_nock);
  bow.worldToLocal(_nock);
  _nock.x = clamp(_nock.x, -0.08, 0.08);
  _nock.y = clamp(_nock.y, -0.16, 0.16);
  _nock.z = s.tipZ - CONFIG.player.bow.drawDepth * player.anim.draw;
  for (const [m, ty] of [[s.up, s.tipY], [s.dn, -s.tipY]]) {
    _seg.set(_nock.x, _nock.y - ty, _nock.z - s.tipZ);
    const len = _seg.length() || 0.001;
    m.position.set(_nock.x / 2, (ty + _nock.y) / 2, (s.tipZ + _nock.z) / 2);
    m.quaternion.setFromUnitVectors(_axisY, _seg.divideScalar(len));
    m.scale.y = len;
  }
  // 番え矢は弦を引き始めたら見せる(リリースで draw が即 0 に落ちるので、
  // 放った瞬間に矢が消えて発射された矢と繋がる)。矢筈は弦の折れ目に置く
  s.nock.visible = player.aiming && player.anim.draw > 0.12;
  s.nock.position.set(_nock.x * 0.6, _nock.y * 0.6, _nock.z + 0.475);
}

// 走りの土煙: 足が地面を蹴る位相に合わせて足元へ小さな煙を出す。
// 俯瞰では脚の動きがほぼ見えないので、「滑っている」でなく「走っている」に見せる主役はこれ
const dustPool = (function () {
  const d = CONFIG.player.dust;
  const geo = new THREE.CircleGeometry(d.size, 10);
  const items = [];
  for (let i = 0; i < d.count; i++) {
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: 0xc8d2e4, transparent: true, opacity: 0, depthWrite: false,
    }));
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = 0.04;
    mesh.visible = false;
    scene.add(mesh);
    items.push({ mesh, life: 0 });
  }
  return items;
})();

function spawnDust(x, z) {
  for (const p of dustPool) {
    if (p.life > 0) continue;
    p.life = CONFIG.player.dust.duration;
    p.mesh.visible = true;
    p.mesh.scale.setScalar(1);
    p.mesh.position.x = x + (Math.random() - 0.5) * 0.3;
    p.mesh.position.z = z + (Math.random() - 0.5) * 0.3;
    return;
  }
}

function updateDust(dt) {
  const d = CONFIG.player.dust;
  for (const p of dustPool) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.mesh.visible = false; continue; }
    const t = 1 - p.life / d.duration;                 // 0 → 1
    p.mesh.scale.setScalar(1 + t * (d.grow - 1));
    p.mesh.material.opacity = d.opacity * (1 - t);
  }
}

function resetDust() {
  for (const p of dustPool) { p.life = 0; p.mesh.visible = false; }
}

// 走り・構え・マントのアニメーション
function updatePlayerAnimation(dt) {
  const P = player.parts, A = player.anim;
  A.idle += dt;
  A.runW += ((player.moving ? 1 : 0) - A.runW) * Math.min(1, dt * 12);
  A.aim += ((player.aiming ? 1 : 0) - A.aim) * Math.min(1, dt * 12);
  // 弓の引き: 目標値(drawGoal。updatePlayer が発射サイクルから毎フレーム計算)へ追従する。
  // リリース直後(release > 0)は目標を 0 に固定し、弦が「バチン」と戻って見える速さで抜く
  const bowC = CONFIG.player.bow;
  if (A.release > 0) A.release = Math.max(0, A.release - dt / bowC.releaseTime);
  const releasing = A.release > 0;
  A.draw += ((releasing ? 0 : A.drawGoal) - A.draw) *
    Math.min(1, dt * (releasing ? bowC.releaseSnap : bowC.drawSmoothing));
  if (player.moving) {
    // 歩調は移動速度スキルに合わせて速める(速いのに足のリズムが同じだと滑って見える)
    const sPrev = Math.sin(A.run);
    A.run = (A.run + dt * 12.5 * Math.min(level.stats.speedMul, 1.6)) % (Math.PI * 2);
    // sin の符号が変わる瞬間 = 足が地面を蹴る位相。左右の足ぶん半周期ごとに土煙
    if (sPrev * Math.sin(A.run) <= 0) {
      const back = CONFIG.player.dust.back;
      spawnDust(
        player.mesh.position.x - Math.sin(player.mesh.rotation.y) * back,
        player.mesh.position.z - Math.cos(player.mesh.rotation.y) * back
      );
    }
  }

  const w = A.runW, aim = A.aim;
  const s = Math.sin(A.run);

  // 脚: 前後スイング + 後ろ側だけ膝を曲げる(短い脚なので振りは控えめ)
  P.legL.hip.rotation.x = s * 0.85 * w;
  P.legR.hip.rotation.x = -s * 0.85 * w;
  P.legL.knee.rotation.x = (0.1 + Math.max(0, -s) * 0.8) * w;
  P.legR.knee.rotation.x = (0.1 + Math.max(0, s) * 0.8) * w;

  // 腕: 走りの振りと構えポーズをブレンド
  // 構えは弓道の半身: 体を stance ぶん開き(左肩が敵側)、弓手(armL)は射線に沿って
  // 真っ直ぐ伸ばし、引き手(armR)は肘だけでなく**肩ごと**後ろへ引く。
  // 引き絞り(draw ≈ 1)ではわずかに震え、リリース(fling)では引き手が後ろへ流れて
  // 弓手が跳ね上がる(フォロースルー)
  const rest = 1 - aim;
  const draw = A.draw;
  const fling = A.release * A.release;                       // 放った瞬間が最大で滑らかに収まる
  const tension = Math.max(0, (draw - 0.85) / 0.15) * aim;   // 引き絞り度(引き切り付近だけ 1)
  const tremor = Math.sin(A.idle * 46) * bowC.holdTremor * tension;
  const S = bowC.stance;
  // 弓手: 肩を x=-π/2 で水平に上げ、z=-stance で体の開きを打ち消すと腕が射線に重なる
  P.armL.shoulder.rotation.x = (-0.45 - s * 0.35 * w) * rest +
    (-1.52 - bowC.recoil * fling + tremor * 0.5) * aim;
  P.armL.shoulder.rotation.z = -0.14 * rest + (-S + 0.06) * aim;
  P.armL.elbow.rotation.x = (0.5 + Math.max(0, s) * 0.3 * w) * rest + 0.05 * aim;
  // 引き手: draw 0 では弦へ手を伸ばし(前方)、draw 1 で肩ごと後方へ。
  // リリースでは勢いでさらに後ろ外側へ流れる
  P.armR.shoulder.rotation.x = (s * 0.7 * w) * rest +
    (-1.0 + 2.2 * draw + 0.35 * fling) * aim;
  P.armR.shoulder.rotation.z = 0.14 * rest + (-0.2 + 1.0 * draw + 0.5 * fling) * aim;
  P.armR.elbow.rotation.x = (0.35 + Math.max(0, -s) * 0.45 * w) * rest +
    (0.35 + 0.75 * draw + tremor) * aim;

  // 体幹: 走りは前傾+上下動。構えは root ごと半身に開く(弓は updateBowPose が
  // 体の向きに関係なく射線へ向け続けるので、体を開いても矢はずれない)。
  // 引くほど上体のひねりが深まり、リリースの反動で体が後ろへ持っていかれる
  // (のけぞり recoilPitch + 後ずさり recoilBack。fling は放った瞬間が最大)
  P.root.rotation.y = S * aim;
  P.root.rotation.x = 0.2 * w + (-0.1 * draw - bowC.recoilPitch * fling) * aim;
  P.root.position.y = Math.abs(s) * 0.11 * w + Math.sin(A.idle * 2.2) * 0.014 * (1 - w);
  P.root.position.z = -bowC.recoilBack * fling * aim;        // 射線と逆(手前)へ後ずさる
  P.torso.rotation.y = (0.2 * draw - 0.15 * fling) * aim;    // 上体は半身からさらにひねる
  P.torso.rotation.z = s * 0.09 * w;
  // 頭: 体は開いても目線は敵へ(半身+ひねりを打ち消して射線の先を見据える)
  P.head.rotation.y = (-S * 0.8 - 0.18 * draw) * aim;
  P.head.rotation.x = -0.08 * w;
  P.head.rotation.z = -s * 0.1 * w;

  // マント: 走ると後ろへなびき、静止時はゆっくり揺れる
  // 節は入れ子なので角度は累積する。全体で 70 度ほどに収まる配分にしている
  const wave = [0.35, 0.22, 0.16];
  P.cape.forEach((seg, i) => {
    const t = A.idle * 5.5 - i * 0.7;
    const target = 0.06 + wave[i] * w + Math.sin(t) * (0.04 + 0.03 * i) * (0.4 + w);
    seg.rotation.x += (target - seg.rotation.x) * Math.min(1, dt * 8);
  });

  // 足元リングはゆっくり回し、構え中は少し強く光らせる
  P.ring.rotation.z -= dt * 0.9;
  P.ring.material.opacity = 0.38 + 0.22 * aim;

  // グレイズ判定範囲リング: 成立直後だけ明るくし、指数減衰でなく線形に戻す(短いので十分)
  const gz = CONFIG.graze;
  if (graze.rangeFlash > 0) graze.rangeFlash = Math.max(0, graze.rangeFlash - dt);
  P.grazeRing.material.opacity = gz.rangeRingOpacity +
    (gz.rangeRingFlashOpacity - gz.rangeRingOpacity) * (graze.rangeFlash / gz.rangeRingFlashDuration);
  P.grazeRing.scale.setScalar(level.stats.grazeRange);   // 弾幕遊戯の範囲拡大を見た目にも反映

  // 獅子の間合いのリング(takeSkill で遅延生成)。取得中だけ表示
  if (P.lionRing) P.lionRing.visible = !!level.stats.lion;

  updateBowPose();
  updateBowString();
}

function resetPlayer() {
  player.mesh.position.set(0, 0, 0);
  player.mesh.rotation.set(0, 0, 0);   // lookAt が残した x/z 成分ごと消す
  player.maxHp = CONFIG.player.maxHp;
  player.hp = player.maxHp;
  player.fireTimer = 0;
  player.invincible = 0;
  player.moving = false;
  player.aiming = false;
  Object.assign(player.anim, { run: 0, runW: 0, aim: 0, draw: 0, drawGoal: 0, release: 0, idle: 0 });
  playerHpBar.lagRatio = 1;
  resetDust();
  updatePlayerAnimation(0);
}

function damagePlayer(amount) {
  if (player.invincible > 0 || state.phase !== 'playing') return;
  player.hp -= amount;
  player.invincible = CONFIG.player.hitInvincible;
  // 残心: 被弾でチャージ全損(明鏡止水があれば半分だけ失う)
  if (level.stats.zanshin && graze.charges > 0) {
    graze.charges = level.stats.mirror ? Math.floor(graze.charges / 2) : 0;
    updateGrazeHud();
  }
  onPlayerHitArts();                // 報復の剣(無敵中に弾かれた分では発動しない)
  updateHud();
  if (player.hp <= 0) {
    player.hp = 0;
    gameOver();
  }
}

// =====================================================================
// 弾・プール
// =====================================================================
function makePool(size, buildMesh) {
  const items = [];
  for (let i = 0; i < size; i++) {
    const mesh = buildMesh();
    mesh.visible = false;
    scene.add(mesh);
    // near/grazed: グレイズ判定用。至近を通ったか / もう数えたか(1発で何度も溜まらないように)
    // pierce/hits: 貫通スキル用。残り貫通数 / もうヒットした敵(多重ヒット防止。Set は使い回す)
    // elems: 自弾のエレメント(命中時に applyElems が読む。null なら無属性)
    items.push({
      mesh, active: false, vel: new THREE.Vector3(), damage: 0, life: 0,
      near: false, grazed: false, pierce: 0, hits: null, elems: null, crit: false,
    });
  }
  return items;
}

// プレイヤーの矢
const arrowPool = makePool(CONFIG.pool.arrows, () => {
  const m = new THREE.Mesh(
    new THREE.ConeGeometry(0.12, 0.8, 6),
    new THREE.MeshBasicMaterial({ color: 0xffee66 })
  );
  m.rotation.x = Math.PI / 2;
  return m;
});

// 敵弾
const bulletPool = makePool(CONFIG.pool.bullets, () =>
  new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0xff88aa })
  )
);

// 三日月刃(弦月の構え)。矢の置き換えだが「触れている間、一定間隔で刻む」独自の
// 当たり方をするため playerShotPools には入れず updateCrescents() で回す。
// ジオメトリは全刃で共有し、寿命でグローの明るさを変えるためマテリアルだけ刃ごとに持つ
const CRESCENT_ARC = Math.PI * 1.35;          // 3/4 欠けの月
const CRESCENT_GEO_R = 0.65;                  // ジオメトリの見た目半径(コアの外周)。判定半径→スケール換算用
const crescentGeos = {
  glow: new THREE.TorusGeometry(0.55, 0.16, 10, 40, CRESCENT_ARC),
  core: new THREE.TorusGeometry(0.55, 0.075, 10, 40, CRESCENT_ARC),
  film: new THREE.CircleGeometry(0.5, 40),    // 内側の薄い膜(研削の「場」を感じさせる)
};
const crescentPool = makePool(CONFIG.pool.crescents, () => {
  const g = new THREE.Group();
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xffd76a, transparent: true, opacity: 0.35,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xffedb0 });
  const filmMat = new THREE.MeshBasicMaterial({
    color: 0xffe9a8, transparent: true, opacity: 0.12,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  });
  g.add(new THREE.Mesh(crescentGeos.glow, glowMat));
  g.add(new THREE.Mesh(crescentGeos.core, coreMat));
  g.add(new THREE.Mesh(crescentGeos.film, filmMat));
  g.userData = { glowMat, coreMat };          // 更新時に触るのはこの2枚だけ
  return g;
});

function spawnFromPool(pool, pos, dir, speed, damage) {
  for (const b of pool) {
    if (b.active) continue;
    b.active = true;
    b.mesh.visible = true;
    b.mesh.position.copy(pos);
    b.vel.copy(dir).multiplyScalar(speed);
    b.damage = damage;
    b.life = 6;
    b.near = false;
    b.grazed = false;
    b.pierce = 0;
    b.elems = null;
    b.crit = false;
    b.owner = null;                   // 敵弾の撃ち主(見切りの星の狙い先。プールの使い回しで残さない)
    if (b.hits) b.hits.clear();
    if (pool === arrowPool) {
      b.mesh.lookAt(pos.clone().add(dir));
      b.mesh.rotateX(Math.PI / 2);
    }
    return b;
  }
  return null;
}

function deactivate(b) {
  b.active = false;
  b.mesh.visible = false;
}

function clearPool(pool) { pool.forEach(deactivate); }

// =====================================================================
// ヒット・発射エフェクト
// =====================================================================
// 攻撃の手応えを作る4点セット: 発射の閃光 / 矢の軌跡 / ヒットの白い煙 / 星形の火花。
// すべてプール + 事前生成テクスチャで、フレーム中に new しない(数値は CONFIG.fx)。
// スプライトは常にカメラを向くので、俯瞰でも板の向きを気にしなくてよい
const fxTextures = (function () {
  function canvasTex(draw) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;                 // 2の冪(WebGL1 でもミップマップが使える)
    draw(c.getContext('2d'));
    return new THREE.CanvasTexture(c);
  }
  // ソフトな円(煙・ぼかし光用)
  const circle = canvasTex((ctx) => {
    const g = ctx.createRadialGradient(32, 32, 4, 32, 32, 30);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.65, 'rgba(255,255,255,0.55)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 64, 64);
  });
  // 4方向に尖った星(キラッとした火花・閃光用)
  const star = canvasTex((ctx) => {
    ctx.translate(32, 32);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      ctx.lineTo(Math.cos(a) * 30, Math.sin(a) * 30);
      const m = a + Math.PI / 4;
      ctx.lineTo(Math.cos(m) * 4.5, Math.sin(m) * 4.5);
    }
    ctx.closePath();
    ctx.fill();
  });
  // 矢の軌跡(進行方向側が濃く、尾へ向けて消える縦グラデーション)
  const trail = canvasTex((ctx) => {
    const g = ctx.createLinearGradient(0, 0, 0, 64);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.35)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 64, 64);
  });
  return { circle, star, trail };
})();

function makeSpritePool(count, tex, blending, renderOrder) {
  const items = [];
  for (let i = 0; i < count; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, transparent: true, opacity: 0, depthTest: false,
      blending: blending || THREE.NormalBlending,
    }));
    sp.renderOrder = renderOrder;
    sp.visible = false;
    scene.add(sp);
    items.push({ sp, life: 0, dur: 1, size: 1, grow: 1, opacity: 1, spin: 0, vel: new THREE.Vector3() });
  }
  return items;
}
// renderOrder: 煙(14) < 火花(15) < 閃光(16) < ダメージ数字(20)
const puffPool = makeSpritePool(CONFIG.fx.puff.count, fxTextures.circle, THREE.NormalBlending, 14);
const sparkPool = makeSpritePool(CONFIG.fx.spark.count, fxTextures.star, THREE.AdditiveBlending, 15);
const flashPool = makeSpritePool(6, fxTextures.star, THREE.AdditiveBlending, 16);

// プールから1つ確保する。空きが無ければ一番古いものを奪う(出ない方が違和感が大きい)
function takeFx(pool) {
  let item = null;
  for (const it of pool) {
    if (it.life <= 0) return it;
    if (!item || it.life < item.life) item = it;
  }
  return item;
}

function spawnPuff(x, y, z, size, color) {
  const C = CONFIG.fx.puff;
  const p = takeFx(puffPool);
  p.life = p.dur = C.duration;
  p.size = size;
  p.grow = C.grow;
  p.opacity = C.opacity;
  p.sp.visible = true;
  p.sp.position.set(x, y, z);
  p.sp.material.color.setHex(color);
  p.sp.material.rotation = Math.random() * Math.PI;
  return p;
}

function spawnSparks(x, y, z, n, color) {
  const C = CONFIG.fx.spark;
  for (let i = 0; i < n; i++) {
    const s = takeFx(sparkPool);
    s.life = s.dur = C.duration * (0.75 + Math.random() * 0.5);
    s.size = C.size * (0.7 + Math.random() * 0.6);
    s.opacity = 1;
    s.spin = (Math.random() < 0.5 ? -1 : 1) * C.spin * (0.5 + Math.random());
    const a = Math.random() * Math.PI * 2;
    const sp = C.speed * (0.5 + Math.random() * 0.7);
    s.vel.set(Math.cos(a) * sp, C.upSpeed * (0.4 + Math.random() * 0.8), Math.sin(a) * sp);
    s.sp.visible = true;
    s.sp.position.set(x, y, z);
    s.sp.material.color.setHex(color);
    s.sp.material.rotation = Math.random() * Math.PI;
  }
}

function spawnFlash(x, y, z, size, color) {
  const C = CONFIG.fx.muzzle;
  const f = takeFx(flashPool);
  f.life = f.dur = C.duration;
  f.size = size;
  f.grow = C.grow;
  f.opacity = 1;
  f.sp.visible = true;
  f.sp.position.set(x, y, z);
  f.sp.material.color.setHex(color);
  f.sp.material.rotation = Math.random() * Math.PI;
}

// ヒットの手応え(白い煙 + 金の火花)。strength は強化ショットや撃破で盛る倍率
function spawnHitFx(pos, height, strength) {
  const C = CONFIG.fx;
  spawnPuff(pos.x, height, pos.z, C.puff.size * strength, 0xffffff);
  spawnSparks(pos.x, height, pos.z, C.spark.per, 0xffe27a);
}

// 撃破の弾け(大きめの煙2つ + 多めの火花 + 閃光)。敵の大きさに合わせて radius で盛る
function spawnDeathFx(x, z, height, radius) {
  const C = CONFIG.fx;
  const k = Math.max(1, radius * 1.2);
  spawnPuff(x, height, z, C.puff.size * 1.8 * k, 0xffffff);
  spawnPuff(x + (Math.random() - 0.5) * 0.5, height + 0.25, z + (Math.random() - 0.5) * 0.5,
    C.puff.size * 1.2 * k, 0xffffff);
  spawnSparks(x, height, z, C.spark.killPer, 0xffe27a);
  spawnFlash(x, height, z, C.muzzle.size * k, 0xfff4c9);
}

function updateFx(dt) {
  // 煙: 膨らみながら薄れる
  for (const p of puffPool) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.sp.visible = false; continue; }
    const t = 1 - p.life / p.dur;                       // 0 → 1
    const s = p.size * (1 + t * (p.grow - 1));
    p.sp.scale.set(s, s, 1);
    p.sp.material.opacity = p.opacity * (1 - t) * (1 - t);
  }
  // 火花: 飛び散りながら減速し、回転しつつ縮んで消える
  const drag = CONFIG.fx.spark.drag;
  for (const s of sparkPool) {
    if (s.life <= 0) continue;
    s.life -= dt;
    if (s.life <= 0) { s.sp.visible = false; continue; }
    s.sp.position.addScaledVector(s.vel, dt);
    s.vel.multiplyScalar(Math.max(0, 1 - drag * dt));
    s.sp.material.rotation += s.spin * dt;
    const t = 1 - s.life / s.dur;
    const sc = s.size * (1 - t * 0.8);
    s.sp.scale.set(sc, sc, 1);
    s.sp.material.opacity = 1 - t * t;
  }
  // 閃光: 一瞬で膨らんで消える
  for (const f of flashPool) {
    if (f.life <= 0) continue;
    f.life -= dt;
    if (f.life <= 0) { f.sp.visible = false; continue; }
    const t = 1 - f.life / f.dur;
    const s = f.size * (1 + t * (f.grow - 1));
    f.sp.scale.set(s, s, 1);
    f.sp.material.opacity = 1 - t;
  }
}

function resetFx() {
  for (const pool of [puffPool, sparkPool, flashPool]) {
    for (const it of pool) { it.life = 0; it.sp.visible = false; }
  }
}

// 矢の軌跡(金色の流星)。矢メッシュの子として後方へ伸ばす。
// 矢のローカル +Y が進行方向なので、XY 平面のリボンは「進行方向 × 水平右」の
// 水平な帯になり、俯瞰からそのまま見える。ジオメトリ・マテリアルは全矢で共有
(function attachArrowTrails() {
  const T = CONFIG.fx.trail;
  const geo = new THREE.PlaneGeometry(T.width, T.length);
  const mat = new THREE.MeshBasicMaterial({
    map: fxTextures.trail, color: T.color, transparent: true, opacity: T.opacity,
    depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  });
  for (const b of arrowPool) {
    const t = new THREE.Mesh(geo, mat);
    t.position.y = -(T.length / 2 + 0.25);
    b.mesh.add(t);
  }
})();

// =====================================================================
// グレイズ・強化ショット
// =====================================================================
// 敵弾を「当たらないギリギリ」で通すとチャージが1つ増え、次の攻撃1回ぶん
// (マルチ/バック/サイド込みの斉射全体)がチャージ1消費で2倍ダメージになる。
// 判定そのものは updateProjectiles() の敵弾ループと updateLaser() に組み込んであり
// (当たり判定のループは増やさない)、ここには「成立したら何が起きるか」だけを置く。
const graze = {
  charges: 0,        // 0 〜 CONFIG.graze.chargeMax。firePlayerShot() が1つずつ消費する
  rangeFlash: 0,     // >0 の間は判定範囲リングを明るく表示(成立の瞬間にセット)
};

// グレイズ成立時に一瞬出す白いリング(強化ショット発射の金色の光にも使い回す)
const grazeFxPool = (function () {
  const geo = new THREE.RingGeometry(0.62, 0.78, 28);
  const items = [];
  for (let i = 0; i < CONFIG.graze.fxCount; i++) {
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0,
      side: THREE.DoubleSide, depthWrite: false,
    }));
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = 0.06;
    mesh.visible = false;
    scene.add(mesh);
    items.push({ mesh, life: 0, mul: 1 });
  }
  return items;
})();

function spawnGrazeFx(x, z, mul, color) {
  for (const fx of grazeFxPool) {
    if (fx.life > 0) continue;
    fx.life = CONFIG.graze.fxDuration;
    fx.mul = mul;
    fx.mesh.visible = true;
    fx.mesh.position.set(x, 0.06, z);
    fx.mesh.material.color.setHex(color);
    fx.mesh.material.opacity = 0.9;
    fx.mesh.scale.setScalar(CONFIG.graze.fxStartScale * mul);
    return;
  }
}

function updateGrazeFx(dt) {
  const g = CONFIG.graze;
  for (const fx of grazeFxPool) {
    if (fx.life <= 0) continue;
    fx.life -= dt;
    if (fx.life <= 0) { fx.mesh.visible = false; continue; }
    const t = 1 - fx.life / g.fxDuration;                       // 0 → 1
    fx.mesh.scale.setScalar((g.fxStartScale + (g.fxEndScale - g.fxStartScale) * t) * fx.mul);
    fx.mesh.material.opacity = (1 - t) * 0.9;
  }
}

// グレイズ成立(敵弾・レーザーの判定側から呼ぶ)。src はその弾・レーザーの撃ち主(いれば)
function onGraze(src) {
  graze.charges = Math.min(grazeChargeCap(), graze.charges + 1);
  graze.rangeFlash = CONFIG.graze.rangeRingFlashDuration;
  const p = player.mesh.position;
  spawnGrazeFx(p.x, p.z, 1, 0xffffff);
  onGrazeArts(src);                 // 見切りの星(グレイズ成立トリガー。撃ち主がいればそこへ)
  // 弦月の構え: グレイズが飛んでいる刃の寿命を回復する(弾幕の濃さが刃の燃料になる)。
  // 上限は射抜きの極意で伸びた初期寿命ぶんだけ引き上げる
  const cs = level.stats.crescent;
  if (cs) {
    const lifeCap = cs.lifeMax + level.stats.pierce * cs.pierceLife;
    for (const b of crescentPool) {
      if (!b.active) continue;
      if (b.grind < lifeCap) b.grind++;
      b.flash = 1;
    }
  }
  // 野生解放: グレイズが守護者の手綱(狂化タイマーを満タンに)
  if (level.stats.guardFrenzy) arts.frenzyT = level.stats.guardFrenzy.duration;
  updateGrazeHud();
}

// チャージ消費時の攻撃倍率。grazeup スキルで 2倍 → 2.5倍 → 3倍 と伸びる
const grazeShotMul = () => 1 + (CONFIG.graze.damageMul - 1) * level.stats.grazeMul + level.stats.grazeFlat;
// チャージ上限(残心で10に拡張)
const grazeChargeCap = () => (level.stats.zanshin ? level.stats.zanshin.chargeCap : CONFIG.graze.chargeMax);
// 残心の常時倍率: 満タンで強化ショットと同じ倍率になる(チャージ数に比例)
const zanshinMul = () => 1 + (grazeShotMul() - 1) * (graze.charges / grazeChargeCap());

function resetGraze() {
  graze.charges = 0;
  graze.rangeFlash = 0;
  for (const fx of grazeFxPool) { fx.life = 0; fx.mesh.visible = false; }
  updateGrazeHud();
}

// =====================================================================
// ダメージ数値表示
// =====================================================================
// ヒットのたびに「-12」を敵の上に浮かせて消す。HPバーと同じ理由で板は scene 直下に置き、
// カメラの姿勢をコピーするだけで常に正面を向く(カメラは回転しないため)。
// 浮上と横ずれは**カメラの上/右方向**に取る。ワールドの +Y だと見下ろし角で潰れて
// 「画面上で真上に上がる」動きにならない(呼び出し側が渡す up も画面上の距離)。
// 文字はヒットごとに変わるのでプールの1要素が canvas を1枚ずつ持ち、
// 描き直して needsUpdate を立てる(フレーム中に new しない)。
const dmgTextGeo = new THREE.PlaneGeometry(1, 1);

const dmgTextPool = (function () {
  const C = CONFIG.damageText;
  const items = [];
  for (let i = 0; i < C.count; i++) {
    const canvas = document.createElement('canvas');
    canvas.width = C.canvasW;
    canvas.height = C.canvasH;
    const ctx = canvas.getContext('2d');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    const tex = new THREE.CanvasTexture(canvas);
    // ミップマップを作らせない(WebGL1 では非2の冪テクスチャの作り直しが走るため)
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    const mesh = new THREE.Mesh(dmgTextGeo, new THREE.MeshBasicMaterial({
      map: tex, transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
    }));
    mesh.renderOrder = 20;          // HPバー(10〜12)より手前
    mesh.visible = false;
    scene.add(mesh);
    // base: 浮上前の基準位置。毎フレームここから上方向へ足し直す
    items.push({ mesh, ctx, tex, life: 0, base: new THREE.Vector3(), scaleMul: 1, tilt: 0 });
  }
  return items;
})();

function drawDmgText(item, text, color) {
  const C = CONFIG.damageText;
  const ctx = item.ctx;
  ctx.clearRect(0, 0, C.canvasW, C.canvasH);
  ctx.font = '900 ' + C.fontPx + "px 'Helvetica Neue', Arial, sans-serif";
  ctx.lineWidth = C.fontPx * 0.22;
  ctx.strokeStyle = C.outlineColor;
  ctx.strokeText(text, C.canvasW / 2, C.canvasH / 2);
  ctx.fillStyle = color;
  ctx.fillText(text, C.canvasW / 2, C.canvasH / 2);
  item.tex.needsUpdate = true;
}

const dmgTextUp = new THREE.Vector3();      // カメラの真上方向(ワールド)。毎フレームの new を避ける
const dmgTextRight = new THREE.Vector3();

// pos: ワールド座標 / up: そこから画面上へ逃がす距離 /
// spread: 画面横方向にばらす幅(HPバーの上に数字が居座らないよう、バーの幅に応じて広げる)
// kind: damageEnemy と同じ(undefined = 直撃 / 'crit' = 強化 / 'dot' = 継続系)
function spawnDamageText(pos, amount, up, spread, kind) {
  const C = CONFIG.damageText;
  // 空きが無ければ一番古い(残り時間が最短の)ものを奪う。
  // マルチショットの同時ヒットでも「出たはずの数字が出ない」ことがないように
  let item = null;
  for (const it of dmgTextPool) {
    if (it.life <= 0) { item = it; break; }
    if (!item || it.life < item.life) item = it;
  }
  item.life = C.duration;
  item.scaleMul = kind === 'crit' ? C.scaleCrit : kind === 'dot' ? C.scaleDot : 1;
  item.tilt = (Math.random() * 2 - 1) * C.tilt;
  drawDmgText(item, '-' + Math.max(1, Math.round(amount)), C.colors[kind] || C.colors.normal);

  dmgTextUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
  dmgTextRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
  item.base.copy(pos)
    .addScaledVector(dmgTextUp, up)
    .addScaledVector(dmgTextRight, (Math.random() * 2 - 1) * spread);
  item.mesh.visible = true;
}

function updateDamageTexts(dt) {
  const C = CONFIG.damageText;
  const aspect = C.canvasW / C.canvasH;
  dmgTextUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
  for (const item of dmgTextPool) {
    if (item.life <= 0) continue;
    item.life -= dt;
    if (item.life <= 0) { item.mesh.visible = false; continue; }
    const elapsed = C.duration - item.life;
    const t = elapsed / C.duration;                                  // 0 → 1
    // 浮上は最初が速い ease-out。カメラの上方向なので画面上で真上に上がる
    item.mesh.position.copy(item.base)
      .addScaledVector(dmgTextUp, C.rise * (1 - (1 - t) * (1 - t)));
    item.mesh.quaternion.copy(camera.quaternion);
    item.mesh.rotateZ(item.tilt);   // カメラ正面を向けたまま、画面上でわずかに傾ける
    // 出現直後だけ大きく弾ませる(当たった瞬間の手応え)
    const pop = 1 + (C.popScale - 1) * Math.max(0, 1 - elapsed / C.popTime);
    const h = C.height * pop * item.scaleMul;
    item.mesh.scale.set(h * aspect, h, 1);
    item.mesh.material.opacity = t < C.fadeStart ? 1 : 1 - (t - C.fadeStart) / (1 - C.fadeStart);
  }
}

function resetDamageTexts() {
  for (const item of dmgTextPool) { item.life = 0; item.mesh.visible = false; }
}
