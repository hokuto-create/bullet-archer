  lv: 1,
  exp: 0,
  next: CONFIG.level.baseExp,       // 次のレベルまでの必要経験値
  pending: 0,                       // 未処理のレベルアップ数(まとめて上がっても1回ずつ選ばせる)
  taken: {},                        // skillId -> 取得回数
  stats: null,                      // taken から求めた派生ステータス(下で初期化)
};

function recomputeSkillStats() {
  const n = (id) => level.taken[id] || 0;
  // ファミリーごとの属性リスト(取った属性は全部スタックする)と、確率系スキルの現在値
  const elems = (prefix) => ['fire', 'ice', 'thunder', 'poison'].filter((el) => n(prefix + '_' + el) > 0);
  const chance = (id) => (n(id) > 0 ? SKILLS[id].chances[n(id) - 1] : 0);
  // 軍神の加護は全攻撃強化: 矢(damageMul)と召喚(summonMul)の両方に乗算で掛ける
  const allMul = 1 + SKILLS.warlord.value * n('warlord');
  // 召喚王の威光: 召喚のダメージに乗算 + 「速さ」にも一括で効く
  // (星=発動率、霊剣=周期短縮、守護者=攻撃間隔短縮。消費側は毎回 stats を読むのでここで焼き込む)
  const summonRate = 1 + SKILLS.summon_king.value * n('summon_king');
  // 獅子の間合い: 発射間隔のデメリットは fireMul を割る形で焼き込む
  // (発射サイクル由来の弓の構えモーションも自動で遅くなる)
  const lion = n('lion_stance') > 0 ? SKILLS.lion_stance : null;
  const crescent = n('crescent') > 0 ? SKILLS.crescent : null;   // 弦月の構えも発射間隔を倍にする
  level.stats = {
    damageMul: (1 + SKILLS.power.value * n('power') + SKILLS.mighty.value * n('mighty')) * allMul,
    fireMul: (1 + SKILLS.rapid.value * n('rapid') + SKILLS.flurry.value * n('flurry'))
      / (lion ? lion.intervalMul : 1) / (crescent ? crescent.intervalMul : 1),
    lion,                             // 獅子の間合い(未取得なら null。距離倍率は firePlayerShot が読む)
    crescent,                         // 弦月の構え(未取得なら null。fireArrow が矢を刃に置き換える)
    arrowHitMul: n('broadhead') > 0 ? SKILLS.broadhead.hitMul : 1,   // 大鏃: 矢の当たり判定倍率
    echo: n('echo_head') > 0 ? SKILLS.echo_head : null,              // 残響の鏃(刃では刻み倍速に変質)
    eclipse: n('eclipse') > 0,        // 月蝕: 自弾が敵弾をかき消してグレイズ化
    speedMul: 1 + SKILLS.boots.value * n('boots'),
    multishot: n('multishot'),      // 正面の追加本数
    pierce: n('pierce'),            // 貫通できる敵の数
    back: n('back') > 0,
    side: n('side') > 0,
    grazeMul: 1 + SKILLS.grazeup.value * n('grazeup'),
    zanshin: n('zanshin') > 0 ? SKILLS.zanshin : null,   // 残心(チャージ非消費・常時倍率)
    maai: n('maai') > 0 ? SKILLS.maai : null,            // 間合いの妙(リング内の敵弾減速)
    mirror: n('mirror') > 0 ? SKILLS.mirror : null,      // 明鏡止水(満タンで敵弾減速・損失半減)
    grazeRange: n('graze_dance') > 0 ? SKILLS.graze_dance.rangeMul : 1,   // グレイズ判定半径の倍率
    grazeFlat: n('graze_dance') > 0 ? SKILLS.graze_dance.bonus : 0,       // 強化ショット倍率への加算
    homing: n('homing') > 0,          // 矢の追尾
    regenChance: n('regen') > 0 ? SKILLS.regen.chance : 0,   // ヒット時にHP回復する確率
    // --- 召喚攻撃・エレメント ---
    arrowElems: elems('arrow'),               // 矢に乗る属性
    summonMul: (1 + SKILLS.summon_power.value * n('summon_power') + SKILLS.summon_mastery.value * n('summon_mastery')) * allMul * summonRate,
    star: {
      onAttack: Math.min(1, chance('star_attack') * summonRate),   // 攻撃時に星が落ちる確率
      onKill: Math.min(1, chance('star_kill') * summonRate),       // 撃破時に星が落ちる確率
      onGraze: n('star_graze') > 0,
      twin: n('star_twin') > 0,
      gravity: n('star_gravity') > 0 ? SKILLS.star_gravity : null, // 天墜の座(吸い込み・威力/範囲1.5倍)
      // 予兆時間の倍率(天墜で延び、鈴で縮む。両取りでほぼ元どおり)
      telegraphMul: (n('star_gravity') > 0 ? SKILLS.star_gravity.telegraphMul : 1)
        * (n('star_bell') > 0 ? SKILLS.star_bell.telegraphMul : 1),
      sea: n('star_sea') > 0 ? SKILLS.star_sea : null,             // 星海(燃え跡)
      elems: elems('star'),
    },
    sword: {
      interval: n('sword_rain') > 0 ? SKILLS.sword_rain.intervals[n('sword_rain') - 1] / summonRate : 0,
      onAttack: Math.min(1, chance('sword_attack') * summonRate),
      revenge: n('sword_revenge') > 0,
      count: 1 + n('sword_double'),           // 一度に降る本数
      splash: n('sword_wave') > 0,            // 着弾時の範囲ダメージ(剣気解放)
      oath: n('sword_oath') > 0 ? SKILLS.sword_oath : null,    // 百剣の誓い(剣印→処刑)
      guide: n('sword_guide') > 0,            // 導きの銘(最後に当てた敵を狙う)
      grave: n('sword_grave') > 0 ? SKILLS.sword_grave : null, // 剣ノ墓標(処刑撃破で衝撃波)
      elems: elems('sword'),
    },
    guardianRate: (1 + SKILLS.guard_bond.value * n('guard_bond') + SKILLS.guard_oath.value * n('guard_oath')) * summonRate,
    guardBeast: n('guard_beast') > 0,   // 守護者の弾の巨大化・貫通、落雷2連
    guardFrenzy: n('guard_frenzy') > 0 ? SKILLS.guard_frenzy : null,        // 野生解放(狂化ゲージ)
    guardOrbitMul: n('guard_gallop') > 0 ? SKILLS.guard_gallop.orbitMul : 1, // 早駆けの蹄
  };
}
recomputeSkillStats();

// 経験値の加算とレベルアップ判定。ここではキューに積むだけで、
// 3択画面を開くのは animate()(敵ループの途中で phase を変えないため)
function gainExp(amount) {
  level.exp += amount;
  while (level.exp >= level.next) {
    level.exp -= level.next;
    level.lv++;
    level.next = Math.round(level.next * CONFIG.level.expGrowth);
    level.pending++;
  }
  updateExpHud();
}

function takeSkill(id) {
  level.taken[id] = (level.taken[id] || 0) + 1;
  recomputeSkillStats();
  if (id === 'vital') {             // 即時効果はここで
    player.maxHp += SKILLS.vital.value;
    player.hp = Math.min(player.maxHp, player.hp + SKILLS.vital.value);
    updateHud();
  }
  // 獅子の間合い: ボーナス最大域(nearDist)を足元のリングで常時表示する。
  // buildPlayer() 時点では SKILLS が未定義なので、初取得のここで遅延生成する。
  // 表示の on/off は updatePlayerAnimation() が stats.lion から毎フレーム決めるので、
  // ラン跨ぎ(resetLevel で taken が空になる)でも勝手に消える
  if (id === 'lion_stance' && !player.parts.lionRing) {
    const L = SKILLS.lion_stance;
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(L.nearDist - 0.12, L.nearDist, 64),
      new THREE.MeshBasicMaterial({
        color: 0xffa04c, transparent: true, opacity: CONFIG.graze.rangeRingOpacity,
        side: THREE.DoubleSide, depthWrite: false,
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.02;
    player.mesh.add(ring);
    player.parts.lionRing = ring;
  }
  if (SKILLS[id].family === 'guardian') syncGuardians();   // お供を場に出す/強化を反映
  if (id === 'zanshin') updateGrazeHud();   // 上限・表示形式が変わるので即時反映
}

function resetLevel() {
  level.lv = 1;
  level.exp = 0;
  level.next = CONFIG.level.baseExp;
  level.pending = 0;
  level.taken = {};
  recomputeSkillStats();
  updateExpHud();
}

// スキルを反映した自弾の発射。自弾はすべてここを通るので、攻撃力・貫通は常に一括で乗る。
// mul はグレイズ強化ショットの倍率(省略時 1)
const _arrowDir = new THREE.Vector3();
function fireArrow(origin, dir, angle, speed, baseDamage, mul) {
  _arrowDir.copy(dir);
  if (angle) _arrowDir.applyAxisAngle(_axisY, angle);
  // 弦月の構え: 矢のかわりに三日月刃を放つ(攻撃力・強化倍率は同じ経路で乗る)
  if (level.stats.crescent) {
    return fireCrescent(origin, _arrowDir, baseDamage * level.stats.damageMul * (mul || 1), (mul || 1) >= 2);
  }
  const b = spawnFromPool(arrowPool, origin, _arrowDir, speed, baseDamage * level.stats.damageMul * (mul || 1));
  if (b) {
    b.pierce = level.stats.pierce;
    b.elems = level.stats.arrowElems;   // 矢のエレメント(命中時に applyElems が読む)
    b.mesh.scale.setScalar(level.stats.arrowHitMul);   // 大鏃: 見た目も太る(判定は updateProjectiles 側)
    // 数字を金色・大きめに出す閾値。グレイズ強化は素で2倍からなので従来どおり全部拾い、
    // 獅子の間合いはボーナス域(2倍以上)だけ金にする(遠距離の1.3倍は白のまま)
    b.crit = (mul || 1) >= 2;
  }
  return b;
}

// 三日月刃を1枚放つ。damage は damageMul・強化倍率込みの値。
// 射抜きの極意は刃では「貫通」のかわりに寿命 +pierceLife/Lv として効く
function fireCrescent(origin, dir, damage, crit) {
  const cs = level.stats.crescent;
  const bh = (level.taken.broadhead || 0) > 0 ? SKILLS.broadhead : null;   // 大鏃: 大きく・遅く
  const b = spawnFromPool(crescentPool, origin, dir,
    CONFIG.player.arrowSpeed * cs.speedMul * (bh ? bh.crescentSlow : 1), damage);
  if (b) {
    b.life = cs.flightTime;
    b.elems = level.stats.arrowElems;
    b.crit = crit;
    b.grind = cs.life + level.stats.pierce * cs.pierceLife;   // 残り寿命(合計ヒット数)
    b.tickT = 0;
    b.flash = 0;                      // グレイズ回復の白い瞬き
    b.scaleMul = bh ? bh.crescentScale : 1;
    // 見た目をヒット判定半径(cs.radius × 大鏃倍率)に合わせる
    b.mesh.scale.setScalar((cs.radius / CRESCENT_GEO_R) * b.scaleMul);
    b.mesh.position.y = 0.6;
  }
  return b;
}

// 通常攻撃1回ぶん(マルチショットの扇 + バック/サイドショット)。
// グレイズのチャージがあれば1つ消費し、この斉射全体が強化倍率になる
function firePlayerShot(origin, dir) {
  const st = level.stats;
  const C = CONFIG.player;
  let mul = 1;
  if (st.zanshin) {
    // 残心: チャージは消費せず、積んだ数に応じた常時倍率(満タンで強化ショットと同倍率)
    mul = zanshinMul();
    if (mul >= 2) spawnGrazeFx(origin.x, origin.z, 1.2, 0xffd76a);
  } else if (graze.charges > 0) {
    graze.charges--;
    mul = grazeShotMul();
    spawnGrazeFx(origin.x, origin.z, 1.6, 0xffd76a);   // 強化ショットの金色の光
    updateGrazeHud();
  }
  // 獅子の間合い: 狙った敵との距離で斉射全体の倍率が変わる(近いほど強い)。
  // 発射は最寄りの敵を向いた瞬間なので、距離も最寄りの敵から取れば狙いと一致する。
  // グレイズ強化とは乗算(バック/サイドショット含む全弾に一括で乗る)
  if (st.lion) {
    const t = nearestEnemy();
    if (t) {
      const L = st.lion;
      const d = t.mesh.position.distanceTo(player.mesh.position);
      const k = clamp((d - L.nearDist) / (L.farDist - L.nearDist), 0, 1);
      mul *= L.nearMul + (L.farMul - L.nearMul) * k;
    }
  }
  // 発射の閃光: 弓の少し先に白い星型フラッシュ(強化ショットと獅子のボーナス域は金色で一回り大きく。
  // 閾値は fireArrow の crit と同じ2倍以上)
  spawnFlash(
    origin.x + dir.x * 0.8, origin.y + 0.1, origin.z + dir.z * 0.8,
    CONFIG.fx.muzzle.size * (mul >= 2 ? 1.5 : 1), mul >= 2 ? 0xffd76a : 0xffffff
  );
  const count = 1 + st.multishot;
  for (let i = 0; i < count; i++) {
    fireArrow(origin, dir, (i - (count - 1) / 2) * CONFIG.level.spread, C.arrowSpeed, C.arrowDamage, mul);
  }
  if (st.back) fireArrow(origin, dir, Math.PI, C.arrowSpeed, C.arrowDamage, mul);
  if (st.side) {
    fireArrow(origin, dir, Math.PI / 2, C.arrowSpeed, C.arrowDamage, mul);
    fireArrow(origin, dir, -Math.PI / 2, C.arrowSpeed, C.arrowDamage, mul);
  }
  onPlayerAttackArts();               // 攻撃時トリガーの星・霊剣
}

// =====================================================================
// 召喚攻撃(星・霊剣・守護者)・エレメント
// =====================================================================
// スキルで手に入る、矢とは独立した攻撃手段。
// - 星: 攻撃時/撃破時/グレイズ時のトリガーで敵の足元に落ちる範囲攻撃
// - 霊剣: 周期/攻撃時/被弾時のトリガーでランダムな敵に降る単体攻撃
// - 守護者: 属性ごとのお供。移動中でも自分のタイマーで攻撃する
// エレメント(炎・氷・雷・毒)はファミリーごとに別々に付き、複数取れば全部乗る。
// ダメージはすべて damageEnemy() 経由なので、数値表示・ウェーブクリア判定はそのまま効く

const ELEM_COLORS = { fire: 0xff7a3c, ice: 0x7ad4ff, thunder: 0xffe066, poison: 0x8ce34c };
// 属性付きの召喚は属性色に染める(複数属性なら最後の1つ。無属性は fallback)
const artColor = (elems, fallback) =>
  (elems && elems.length ? ELEM_COLORS[elems[elems.length - 1]] : fallback);

// --- エレメント効果 ---
// base はその攻撃の基礎ダメージ。継続ダメージは base に対する割合なので、
// 同じ属性を強い攻撃に乗せるほど痛くなる。雷だけは状態異常ではなく即時の連鎖ダメージ
// (連鎖ダメージ自体は属性を持たない = 連鎖が連鎖を呼んで無限に走ることはない)。
// 状態異常は敵側のフィールド(burn*/freeze*/poison*)に書き、updateEnemy() が進める
function applyElems(enemy, base, elems) {
  if (!elems || elems.length === 0) return;
  const E = CONFIG.arts.elements;
  for (const el of elems) {
    if (el === 'fire') {
      enemy.burnT = E.fire.duration;
      enemy.burnDmg = Math.max(enemy.burnDmg, base * E.fire.tickPct);
    } else if (el === 'ice') {
      if (enemy.freezeCd <= 0) {
        enemy.freezeT = E.ice.freeze;
        enemy.freezeCd = E.ice.cooldown;
      }
    } else if (el === 'poison') {
      enemy.poisonDmg = Math.max(enemy.poisonDmg, base * E.poison.tickPct);
    } else if (el === 'thunder') {
      chainLightning(enemy, base * E.thunder.pct);
    }
  }
}

function chainLightning(from, dmg) {
  const T = CONFIG.arts.elements.thunder;
  const pos = from.mesh.position;
  // damageEnemy が enemies を splice するのでスナップショットを回す
  for (const other of enemies.slice()) {
    if (other === from || !other.hpBar) continue;
    if (other.mesh.position.distanceToSquared(pos) > T.radius * T.radius) continue;
    spawnBolt(other.mesh.position.x, other.mesh.position.z, ELEM_COLORS.thunder, 0.5);
    damageEnemy(other, dmg, 'dot');
  }
}

// --- 落雷・連鎖の光柱エフェクト(一瞬で薄れる縦の柱) ---
const boltPool = (function () {
  const geo = new THREE.CylinderGeometry(0.07, 0.16, 10, 6, 1, true);
  const items = [];
  for (let i = 0; i < CONFIG.arts.boltPool; i++) {
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: 0xffe066, transparent: true, opacity: 0, depthWrite: false,
    }));
    mesh.visible = false;
    scene.add(mesh);
    items.push({ mesh, life: 0, max: 0.18 });
  }
  return items;
})();

function spawnBolt(x, z, color, width) {
  for (const b of boltPool) {
    if (b.life > 0) continue;
    b.life = b.max;
    b.mesh.visible = true;
    b.mesh.position.set(x, 5, z);
    b.mesh.scale.set(width || 1, 1, width || 1);
    b.mesh.material.color.setHex(color);
    b.mesh.material.opacity = 0.9;
    return;
  }
}

function updateBolts(dt) {
  for (const b of boltPool) {
    if (b.life <= 0) continue;
    b.life -= dt;
    if (b.life <= 0) { b.mesh.visible = false; continue; }
    b.mesh.material.opacity = 0.9 * (b.life / b.max);
  }
}

// --- 星 ---
// 予兆円(敵の赤リングと同じ文法。こちらの攻撃なので金色/属性色)→ 火球落下 → 範囲ダメージ
const starPool = (function () {
  const S = CONFIG.arts.star;
  const items = [];
  for (let i = 0; i < S.pool; i++) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.9, 1.0, 40),
      new THREE.MeshBasicMaterial({ color: S.color, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.05;
    ring.visible = false;
    scene.add(ring);
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 12, 9),
      new THREE.MeshBasicMaterial({ color: S.color })
    );
    ball.visible = false;
    scene.add(ball);
    items.push({ active: false, phase: 'tele', t: 0, delay: 0, x: 0, z: 0, elems: null, ring, ball });
  }
  return items;
})();

function spawnStar(x, z, delay) {
  const h = CONFIG.arena.half - 1;
  x = clamp(x, -h, h);
  z = clamp(z, -h, h);
  for (const s of starPool) {
    if (s.active) continue;
    s.active = true;
    s.phase = 'tele';
    s.t = 0;
    s.delay = delay || 0;
    s.x = x;
    s.z = z;
    s.elems = level.stats.star.elems;   // 属性は着弾まで取得時点のものを持ち回る
    const color = artColor(s.elems, CONFIG.arts.star.color);
    s.ring.material.color.setHex(color);
    s.ball.material.color.setHex(color);
    return;
  }
}

// トリガー各種から呼ぶ入口。双つ星なら少しずらした2発目を予約する
function castStar(x, z) {
  const S = CONFIG.arts.star;
  spawnStar(x, z, 0);
  if (level.stats.star.twin) {
    spawnStar(
      x + (Math.random() * 2 - 1) * S.twinOffset,
      z + (Math.random() * 2 - 1) * S.twinOffset,
      S.twinDelay
    );
  }
}

function castStarAtRandomEnemy() {
  if (enemies.length === 0) return;
  const e = enemies[(Math.random() * enemies.length) | 0];
  castStar(e.mesh.position.x, e.mesh.position.z);
}

// 天墜の座: 予兆〜落下中、円の範囲の敵と敵弾を中心へ吸い込む。
// 敵弾は速さを変えず向きだけ曲げる(吸い込まれた弾は軌道が読みにくい = 予兆円の近くが危険地帯になる)
function applyStarGravity(s, range, dt) {
  const G = level.stats.star.gravity;
  for (const e of enemies) {
    const dx = s.x - e.mesh.position.x, dz = s.z - e.mesh.position.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.3 || d > range + e.def.radius) continue;
    const k = Math.min(G.pull * dt, d - 0.2);   // 中心を通り越さない
    e.mesh.position.x += (dx / d) * k;
    e.mesh.position.z += (dz / d) * k;
  }
  for (const eb of bulletPool) {
    if (!eb.active) continue;
    const dx = s.x - eb.mesh.position.x, dz = s.z - eb.mesh.position.z;
    const d2 = dx * dx + dz * dz;
    if (d2 > range * range || d2 < 1e-4) continue;
    const d = Math.sqrt(d2), sp = eb.vel.length();
    eb.vel.x += (dx / d) * G.bulletPull * dt;
    eb.vel.z += (dz / d) * G.bulletPull * dt;
    eb.vel.setLength(sp);
  }
}

// 星の実効半径(天墜の座で広がる)
const starRadius = () => CONFIG.arts.star.radius *
  (level.stats.star.gravity ? level.stats.star.gravity.radiusMul : 1);

function updateStars(dt) {
  const S = CONFIG.arts.star;
  const st = level.stats.star;
  const effR = starRadius();
  for (const s of starPool) {
    if (!s.active) continue;
    if (s.delay > 0) { s.delay -= dt; continue; }
    s.t += dt;
    if (st.gravity) applyStarGravity(s, effR, dt);
    if (s.phase === 'tele') {
      const t = Math.min(s.t / (S.telegraph * st.telegraphMul), 1);
      s.ring.visible = true;
      s.ring.position.set(s.x, 0.05, s.z);
      s.ring.scale.setScalar(0.3 + t * effR);
      s.ring.material.opacity = 0.35 + 0.35 * Math.sin(state.time * 22);
      if (t >= 1) {
        s.phase = 'fall';
        s.t = 0;
        s.ball.visible = true;
        s.ball.scale.setScalar(st.gravity ? st.gravity.radiusMul : 1);   // 重い星は火球も大きく
      }
    } else {
      const t = Math.min(s.t / S.fallTime, 1);
      s.ball.position.set(s.x, S.fallHeight * (1 - t) + 0.4, s.z);
      if (t >= 1) {
        s.active = false;
        s.ring.visible = s.ball.visible = false;
        starImpact(s);
      }
    }
  }
}

function starImpact(s) {
  const S = CONFIG.arts.star;
  const st = level.stats.star;
  const effR = starRadius();
  spawnGrazeFx(s.x, s.z, 2.4, artColor(s.elems, S.color));   // 着弾の広がるリング
  const dmg = S.damage * level.stats.summonMul * (st.gravity ? st.gravity.dmgMul : 1);
  // damageEnemy が splice するので後ろから回す
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dx = e.mesh.position.x - s.x;
    const dz = e.mesh.position.z - s.z;
    const r = effR + e.def.radius;
    if (dx * dx + dz * dz > r * r) continue;
    // 属性を先に付与する(とどめの一撃でも雷の連鎖は起きる)
    applyElems(e, dmg, s.elems);
    if (e.hpBar) damageEnemy(e, dmg);   // 連鎖が先にこの敵を倒していたら hpBar が null
  }
  if (st.sea) spawnStarSea(s.x, s.z, effR * st.sea.radiusMul, s.elems);   // 星海: 燃え跡を残す
}

// --- 星海(星の着弾点に残る星屑の燃え跡) ---
const starSeaPool = (function () {
  const items = [];
  for (let i = 0; i < 6; i++) {
    const mesh = new THREE.Mesh(
      new THREE.CircleGeometry(1, 32),
      new THREE.MeshBasicMaterial({
        color: CONFIG.arts.star.color, transparent: true, opacity: 0.3,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
      })
    );
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = 0.04;
    mesh.visible = false;
    scene.add(mesh);
    items.push({ active: false, t: 0, tick: 0, x: 0, z: 0, r: 1, mesh });
  }
  return items;
})();

function spawnStarSea(x, z, r, elems) {
  for (const p of starSeaPool) {
    if (p.active) continue;
    p.active = true;
    p.t = 0;
    p.tick = 0;
    p.x = x;
    p.z = z;
    p.r = r;
    p.mesh.visible = true;
    p.mesh.position.set(x, 0.04, z);
    p.mesh.scale.setScalar(r);
    p.mesh.material.color.setHex(artColor(elems, CONFIG.arts.star.color));
    return;
  }
}

function updateStarSea(dt) {
  const sea = level.stats.star.sea;
  for (const p of starSeaPool) {
    if (!p.active) continue;
    if (!sea) { p.active = false; p.mesh.visible = false; continue; }
    p.t += dt;
    p.tick += dt;
    if (p.t >= sea.duration) { p.active = false; p.mesh.visible = false; continue; }
    p.mesh.material.opacity = 0.3 * (1 - p.t / sea.duration) + 0.08;
    if (p.tick >= sea.tickEvery) {
      p.tick = 0;
      const dmg = CONFIG.arts.star.damage * level.stats.summonMul * sea.tickPct;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = e.mesh.position.x - p.x, dz = e.mesh.position.z - p.z;
        const r = p.r + e.def.radius;
        if (dx * dx + dz * dz > r * r) continue;
        damageEnemy(e, dmg, 'dot');
      }
    }
  }
}

// --- 霊剣 ---
// ランダムな敵の頭上に現れて突き落ちる剣。落下中は対象を追うので必中に近いが、
// 落下し切る前に対象が倒れたら最後の位置に落ちて不発(演出だけ出す)
const swordPool = (function () {
  const W = CONFIG.arts.sword;
  const items = [];
  for (let i = 0; i < W.pool; i++) {
    const mesh = new THREE.Mesh(
      new THREE.ConeGeometry(0.16, 1.3, 6),
      new THREE.MeshBasicMaterial({ color: W.color })
    );
    mesh.rotation.x = Math.PI;        // 切っ先を下に
    mesh.visible = false;
    scene.add(mesh);
    items.push({ active: false, t: 0, target: null, x: 0, z: 0, elems: null, mesh });
  }
  return items;
})();

function castSwords(n) {
  if (enemies.length === 0) return;
  // 導きの銘: 最後に自分の攻撃を当てた敵が生きていればそこへ集中(印を1体に溜められる)
  const sw = level.stats.sword;
  const guided = sw.guide && arts.lastHit && arts.lastHit.hpBar ? arts.lastHit : null;
  for (let i = 0; i < n; i++) {
    const target = guided || enemies[(Math.random() * enemies.length) | 0];
    for (const w of swordPool) {
      if (w.active) continue;
      w.active = true;
      w.t = 0;
      w.target = target;
      w.x = target.mesh.position.x;
      w.z = target.mesh.position.z;
      w.elems = level.stats.sword.elems;
      w.mesh.material.color.setHex(artColor(w.elems, CONFIG.arts.sword.color));
      w.mesh.visible = true;
      break;
    }
  }
}

function updateSwords(dt) {
  const W = CONFIG.arts.sword;
  for (const w of swordPool) {
    if (!w.active) continue;
    w.t += dt;
    // removeEnemy 済みの敵は hpBar が null になるのでそれで生存を見る
    if (w.target && w.target.hpBar) {
      w.x = w.target.mesh.position.x;
      w.z = w.target.mesh.position.z;
    }
    const t = Math.min(w.t / W.fallTime, 1);
    w.mesh.position.set(w.x, W.fallHeight * (1 - t) + 0.8, w.z);
    if (t >= 1) {
      w.active = false;
      w.mesh.visible = false;
      const sw = level.stats.sword;
      const splash = sw.splash;
      spawnGrazeFx(w.x, w.z, splash ? 1.8 : 0.9, artColor(w.elems, W.color));
      const dmg = W.damage * level.stats.summonMul * (sw.oath ? sw.oath.dmgMul : 1);   // 百剣の誓いは単発減
      if (w.target && w.target.hpBar) {
        applyElems(w.target, dmg, w.elems);
        if (w.target.hpBar) damageEnemy(w.target, dmg);
        if (sw.oath && w.target.hpBar) addSwordMark(w.target, w.elems);   // 剣印を積む(処刑もここから)
      }
      if (splash) {
        // 剣気解放: 着弾点の周囲(本命の敵は除く)にも割合ダメージ。対象が倒れた不発でも剣気は出る
        const SW = SKILLS.sword_wave;
        const sdmg = dmg * SW.ratio;
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (e === w.target) continue;
          const dx = e.mesh.position.x - w.x, dz = e.mesh.position.z - w.z;
          const r = SW.radius + e.def.radius;
          if (dx * dx + dz * dz > r * r) continue;
          applyElems(e, sdmg, w.elems);
          if (e.hpBar) damageEnemy(e, sdmg);
        }
      }
      w.target = null;                // 敵オブジェクトを掴みっぱなしにしない
    }
  }
}

// --- 百剣の誓い(剣印と処刑)---
// 剣印は敵の頭上で回る小剣で表す。ジオメトリ・マテリアルは全敵で共有し、
// メッシュだけ印が付いた敵に遅延生成する(removeEnemy が回収)
const swordMarkGeo = new THREE.ConeGeometry(0.13, 0.9, 6);
const swordMarkMat = new THREE.MeshBasicMaterial({ color: 0xbfe8ff, transparent: true, opacity: 0.85 });

function addSwordMark(e, elems) {
  const oath = level.stats.sword.oath;
  e.swordMarks++;
  if (!e.markMesh) {
    e.markMesh = new THREE.Mesh(swordMarkGeo, swordMarkMat);
    e.markMesh.rotation.x = Math.PI;    // 切っ先を下に
    scene.add(e.markMesh);
  }
  if (e.swordMarks < oath.marks) return;
  // 処刑: 印1本につき execRatio 倍(単発減とは無関係の素の剣ダメージ基準)
  e.swordMarks = 0;
  const dmg = CONFIG.arts.sword.damage * level.stats.summonMul * oath.execRatio * oath.marks;
  const x = e.mesh.position.x, z = e.mesh.position.z;
  spawnGrazeFx(x, z, 1.6, 0xdfefff);
  spawnFlash(x, 1.0, z, CONFIG.fx.muzzle.size * 1.6, 0xdfefff);
  damageEnemy(e, dmg, 'crit');
  // 剣ノ墓標: 処刑でとどめを刺したときだけ、その場に剣が立って衝撃波
  if (level.stats.sword.grave && !e.hpBar) swordGrave(x, z, elems);
}

// 墓標の衝撃波 + 立つ剣の演出
function swordGrave(x, z, elems) {
  const G = level.stats.sword.grave;
  spawnGrazeFx(x, z, 2.4, 0xbfe8ff);
  const dmg = CONFIG.arts.sword.damage * level.stats.summonMul * G.ratio;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dx = e.mesh.position.x - x, dz = e.mesh.position.z - z;
    const r = G.radius + e.def.radius;
    if (dx * dx + dz * dz > r * r) continue;
    applyElems(e, dmg, elems);
    if (e.hpBar) damageEnemy(e, dmg);
  }
  for (const m of gravePool) {
    if (m.life > 0) continue;
    m.life = m.total;
    m.mesh.visible = true;
    m.mesh.material.opacity = 0.9;
    m.mesh.position.set(x, 0.55, z);   // 刃の下半分が地面に刺さった高さ
    return;
  }
}

const gravePool = (function () {
  const items = [];
  for (let i = 0; i < 4; i++) {
    const mesh = new THREE.Mesh(
      new THREE.ConeGeometry(0.18, 1.5, 6),
      new THREE.MeshBasicMaterial({ color: 0xbfe8ff, transparent: true, opacity: 0.9 })
    );
    mesh.rotation.x = Math.PI;          // 切っ先を下に(地面に突き立つ)
    mesh.visible = false;
    scene.add(mesh);
    items.push({ life: 0, total: 1.5, mesh });
  }
  return items;
})();

function updateGraves(dt) {
  for (const m of gravePool) {
    if (m.life <= 0) continue;
    m.life -= dt;
    if (m.life <= 0) { m.mesh.visible = false; continue; }
    m.mesh.material.opacity = 0.9 * (m.life / m.total);
  }
}

// --- 守護者 ---
// スキルと属性の対応。syncGuardians() が taken からお供の並びを作り直す
const GUARDIAN_SKILLS = { guard_fire: 'fire', guard_ice: 'ice', guard_thunder: 'thunder', guard_poison: 'poison' };
const guardians = [];   // { elem, lv, group, timer, seed }

// 守護者の弾(炎・氷・毒)。矢と同じ当たり判定ループ(updateProjectiles)で処理する
const orbPool = makePool(CONFIG.arts.guardian.pool, () =>
  new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  )
);
// 自弾として扱うプールの一覧(updateProjectiles が回す。フレーム中に配列を作らない)
const playerShotPools = [arrowPool, orbPool];

function buildGuardianMesh(elem) {
  const group = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 12, 9),
    new THREE.MeshBasicMaterial({ color: ELEM_COLORS[elem] })
  );
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(0.27, 12, 9),
    new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 })
  );
  group.add(core, shell);
  scene.add(group);
  return group;
}

function despawnGuardians() {
  for (const g of guardians) scene.remove(g.group);
  guardians.length = 0;
}

// 取得済みの守護者スキルと場のお供を同期する(取得時・リセット時だけ呼ぶ)
function syncGuardians() {
  despawnGuardians();
  for (const id in GUARDIAN_SKILLS) {
    const lv = level.taken[id] || 0;
    if (lv <= 0) continue;
    const elem = GUARDIAN_SKILLS[id];
    guardians.push({
      elem, lv,
      group: buildGuardianMesh(elem),
      timer: Math.random(),           // 召喚直後に全員一斉に撃たないようずらす
      seed: Math.random() * Math.PI * 2,
    });
  }
}

const _guardDir = new THREE.Vector3();
const _guardOrigin = new THREE.Vector3();

function updateGuardians(dt) {
  const G = CONFIG.arts.guardian;
  const pp = player.mesh.position;
  // 野生解放: グレイズで狂化(間隔半分・弾大きめ・回転速め)、切れている間は鈍る
  const fz = level.stats.guardFrenzy;
  if (arts.frenzyT > 0) arts.frenzyT -= dt;
  const frenzied = !!fz && arts.frenzyT > 0;
  const frenzyRate = fz ? (frenzied ? fz.rateMul : 1 / fz.slowMul) : 1;
  // 公転角は積分で持つ(早駆け・狂化で速度が変わった瞬間に位置が跳ばないように)
  arts.orbitA += G.orbitSpeed * level.stats.guardOrbitMul * (frenzied ? 1.3 : 1) * dt;
  for (let i = 0; i < guardians.length; i++) {
    const g = guardians[i];
    // プレイヤーの周りをゆっくり回りながら上下に浮遊する
    const a = arts.orbitA + (i / guardians.length) * Math.PI * 2;
    g.group.position.set(
      pp.x + Math.cos(a) * G.orbitRadius,
      G.height + Math.sin(state.time * 3 + g.seed) * 0.15,
      pp.z + Math.sin(a) * G.orbitRadius
    );
    // 狂化中は体が膨らんで脈打つ(発光パーツは使わない方針なので大きさで語る)
    g.group.scale.setScalar(frenzied ? 1.25 + 0.1 * Math.sin(state.time * 10) : 1);
    if (enemies.length === 0) continue;
    g.timer -= dt;
    if (g.timer > 0) continue;
    const lv2 = g.lv >= 2;
    const rate = level.stats.guardianRate * frenzyRate / (lv2 ? G.lv2IntervalMul : 1);
    const dmgMul = level.stats.summonMul * (lv2 ? G.lv2DamageMul : 1);
    if (g.elem === 'thunder') {
      // 雷の守護者だけ即着弾の落雷(属性の連鎖もここから起きる)。
      // 聖獣化で2体同時。連鎖で敵配列が縮むことがあるので1体ごとに引き直す
      g.timer = G.boltInterval / rate;
      const bolts = level.stats.guardBeast ? SKILLS.guard_beast.bolts : 1;
      const dmg = G.boltDamage * dmgMul;
      for (let k = 0; k < bolts; k++) {
        if (enemies.length === 0) break;
        const e = enemies[(Math.random() * enemies.length) | 0];
        spawnBolt(e.mesh.position.x, e.mesh.position.z, ELEM_COLORS.thunder, 1);
        applyElems(e, dmg, ['thunder']);
        if (e.hpBar) damageEnemy(e, dmg);
      }
    } else {
      g.timer = G.orbInterval / rate;
      const e = nearestEnemy();
      _guardDir.subVectors(e.mesh.position, g.group.position);
      _guardDir.y = 0;
      if (_guardDir.lengthSq() < 1e-6) continue;
      _guardDir.normalize();
      _guardOrigin.set(g.group.position.x, 0.9, g.group.position.z);
      const b = spawnFromPool(orbPool, _guardOrigin, _guardDir, G.orbSpeed, G.orbDamage * dmgMul);
      if (b) {
        b.elems = GUARDIAN_ELEMS[g.elem];
        b.mesh.material.color.setHex(ELEM_COLORS[g.elem]);
        // 聖獣化: 弾が巨大化して貫通する(scale はプール使い回しなので毎回設定する)。
        // 狂化中の弾はさらに一回り大きい
        b.pierce = level.stats.guardBeast ? SKILLS.guard_beast.pierce : 0;
        b.mesh.scale.setScalar((level.stats.guardBeast ? SKILLS.guard_beast.scale : 1)
          * (frenzied ? fz.orbScale : 1));
      }
    }
  }
}

// 守護者の弾に持たせる属性配列(発射のたびに new しないため属性ごとに1つ持つ)
const GUARDIAN_ELEMS = { fire: ['fire'], ice: ['ice'], thunder: ['thunder'], poison: ['poison'] };

// --- トリガーと毎フレーム更新 ---
const arts = {
  swordTimer: 0,
  lastHit: null,    // 最後に自分の攻撃(矢・刃・守護者の弾)を当てた敵。導きの銘の狙い先
  frenzyT: 0,       // 野生解放: 狂化の残り時間(グレイズで満タン)
  orbitA: 0,        // 守護者の公転角(速度が変わっても跳ばないよう積分で持つ)
};

// 攻撃1回(斉射)ごと: 追撃の星・追影の剣
function onPlayerAttackArts() {
  const st = level.stats;
  if (st.star.onAttack > 0 && Math.random() < st.star.onAttack) castStarAtRandomEnemy();
  if (st.sword.onAttack > 0 && Math.random() < st.sword.onAttack) castSwords(st.sword.count);
}

// 被弾が実際に通ったとき: 報復の剣
function onPlayerHitArts() {
  if (level.stats.sword.revenge) castSwords(3);
}

// グレイズ成立: 見切りの星。かすめた弾の撃ち主が生きていればそこへ撃ち返す(counter-battery)。
// 撃ち主が既に倒れている・分からない(かき消し等)ときはランダムな敵へ
function onGrazeArts(src) {
  if (!level.stats.star.onGraze) return;
  if (src && src.hpBar) castStar(src.mesh.position.x, src.mesh.position.z);
  else castStarAtRandomEnemy();
}

// 敵を倒したとき(倒した位置に落とすので座標だけ受け取る): 弔いの星
function onKillArts(x, z) {
  if (level.stats.star.onKill > 0 && Math.random() < level.stats.star.onKill) castStar(x, z);
}

function updateArts(dt) {
  // 剣の雨(周期トリガー)。敵がいないときはタイマーを止めて無駄撃ちしない
  const sw = level.stats.sword;
  if (sw.interval > 0 && enemies.length > 0) {
    arts.swordTimer -= dt;
    if (arts.swordTimer <= 0) {
      arts.swordTimer = sw.interval;
      castSwords(sw.count);
    }
  }
  updateStars(dt);
  updateStarSea(dt);
  updateSwords(dt);
  updateGraves(dt);
  updateGuardians(dt);
  updateBolts(dt);
}

// 場に出ている星・霊剣・弾・光柱を消す(チャプタークリアやタイトルへの遷移時。守護者は残す)
function clearArtsFx() {
  for (const s of starPool) { s.active = false; s.ring.visible = s.ball.visible = false; }
  for (const p of starSeaPool) { p.active = false; p.mesh.visible = false; }
  for (const w of swordPool) { w.active = false; w.mesh.visible = false; w.target = null; }
  for (const m of gravePool) { m.life = 0; m.mesh.visible = false; }
  for (const b of boltPool) { b.life = 0; b.mesh.visible = false; }
  arts.lastHit = null;               // 導きの銘の狙い先も忘れる(前のランの敵を掴まない)
  arts.frenzyT = 0;                  // 野生解放の狂化も解く
  clearPool(orbPool);
}

// ラン開始時の全リセット。resetLevel() の後に呼ぶ(taken が空なら守護者も全員退場)
function resetArts() {
  clearArtsFx();
  arts.swordTimer = 0;
  syncGuardians();
}

// =====================================================================
// 敵
// =====================================================================
const enemies = [];

// テレグラフ(赤リング予兆)用リング
function makeTelegraphRing() {
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.9, 1.0, 40),
    new THREE.MeshBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.05;
  ring.visible = false;
  scene.add(ring);
  return ring;
}

// --- テレグラフレーザー ---
// 地面に寝かせた 1x1 の面を「原点から dir 方向へ length だけ伸びる帯」として使う。
// ジオメトリを +Y 側へずらしてあるので、位置＝発射点・scale.y＝長さ・rotation.z＝向きで置ける
const laserGeo = new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0);
function makeLaserMesh(color, opacity, y) {
  const m = new THREE.Mesh(laserGeo, new THREE.MeshBasicMaterial({
    color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false,
  }));
  m.rotation.x = -Math.PI / 2;      // 地面に寝かせる(この後 rotation.z で面内を回す)
  m.position.y = y;
  m.visible = false;
  scene.add(m);
  return m;
}
function makeLaserFx() {
  return {
    guide: makeLaserMesh(0xff3344, 0.5, 0.07),   // 予兆の細い赤線
    beam: makeLaserMesh(0xff2a55, 0.7, 0.08),    // 本体
    core: makeLaserMesh(0xfff0f4, 0.95, 0.09),   // 芯の白
  };
}
// rotation.x = -90° の面では、ローカル +Y は回転後に (-sinθ, 0, -cosθ) を向く
function orientLaser(mesh, origin, dir, width, length) {
  mesh.position.set(origin.x, mesh.position.y, origin.z);
  mesh.rotation.z = Math.atan2(-dir.x, -dir.z);
  mesh.scale.set(width, length, 1);
}
// 点とレーザー中心線(線分)の距離
function laserDistance(enemy, px, pz) {
  const o = enemy.laserOrigin, d = enemy.laserDir;
  const t = clamp((px - o.x) * d.x + (pz - o.z) * d.z, 0, enemy.def.laser.length);
  return Math.hypot(o.x + d.x * t - px, o.z + d.z * t - pz);
}

// 予兆 → 発射 → 待機のサイクル。当たり・グレイズ判定もここで見る(別ループは作らない)
function updateLaser(enemy, dt) {
  const L = enemy.def.laser;
  const fx = enemy.laserFx;

  if (enemy.laserPhase === 'telegraph') {
    enemy.laserT += dt;
    fx.guide.material.opacity = 0.35 + 0.35 * Math.sin(state.time * 26);
    if (enemy.laserT >= L.telegraph) {
      // 予兆時の角度・発射点のまま撃つ(以後は追尾しない)
      enemy.laserPhase = 'fire';
      enemy.laserT = 0;
      enemy.laserGrazed = false;
      fx.guide.visible = false;
      orientLaser(fx.beam, enemy.laserOrigin, enemy.laserDir, L.beamWidth, L.length);
      orientLaser(fx.core, enemy.laserOrigin, enemy.laserDir, L.beamWidth * 0.3, L.length);
      fx.beam.visible = fx.core.visible = true;
    }
    return;
  }

  if (enemy.laserPhase === 'fire') {
    enemy.laserT += dt;
    const k = 1 - enemy.laserT / L.duration;                    // 1 → 0
    fx.beam.scale.x = L.beamWidth * (0.6 + 0.4 * k);
    fx.beam.material.opacity = 0.15 + 0.65 * k;
    fx.core.material.opacity = 0.95 * k;

    const pp = player.mesh.position;
    const d = laserDistance(enemy, pp.x, pp.z);
    const half = L.beamWidth / 2;
    if (d < half + CONFIG.player.radius) {
      damagePlayer(L.damage);
    } else if (!enemy.laserGrazed && d < half + CONFIG.graze.outerRadius * level.stats.grazeRange) {
      enemy.laserGrazed = true;                                 // 1本のレーザーにつき1回だけ
      onGraze(enemy);
    }

    if (enemy.laserT >= L.duration) {
      enemy.laserPhase = null;
      enemy.laserTimer = L.interval;
      fx.beam.visible = fx.core.visible = false;
    }
    return;
  }

  enemy.laserTimer -= dt;
  if (enemy.laserTimer > 0) return;
  enemy.laserOrigin.copy(enemy.mesh.position);
  enemy.laserOrigin.y = 0;
  enemy.laserDir.subVectors(player.mesh.position, enemy.laserOrigin);
  enemy.laserDir.y = 0;
  if (enemy.laserDir.lengthSq() < 1e-6) enemy.laserDir.set(0, 0, 1);
  enemy.laserDir.normalize();
  enemy.laserPhase = 'telegraph';
  enemy.laserT = 0;
  orientLaser(fx.guide, enemy.laserOrigin, enemy.laserDir, L.guideWidth, L.length);
  fx.guide.visible = true;
}

// --- 敵HPバー ---
// カメラは向きが固定(平行投影・回転しない)なので、板をカメラの姿勢に合わせれば常に正面を向く。
// 敵の Group は lookAt でヨーが変わってしまうため、バーは scene 直下に置いて位置だけ毎フレーム合わせる。
// ジオメトリは全敵で共有し、大きさは scale で作る(フレーム中に new しない)。
const hpBarBgGeo = new THREE.PlaneGeometry(1, 1);
const hpBarFillGeo = new THREE.PlaneGeometry(1, 1).translate(0.5, 0, 0);  // 左端を軸に伸縮させる

// depthTest を切って手前に描く。敵や壁に隠れて読めなくなる方が困るため
function makeHpBarPart(geo, color, opacity, order) {
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color, transparent: true, opacity, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
  }));
  m.renderOrder = order;
  return m;
}

function makeHpBar(def, isBoss) {
  const C = CONFIG.hpBar;
  const w = isBoss ? C.bossWidth : C.width;
  const h = isBoss ? C.bossHeight : C.height;
  const group = new THREE.Group();

  const bg = makeHpBarPart(hpBarBgGeo, C.bgColor, C.bgOpacity, 10);
  bg.scale.set(w + C.border * 2, h + C.border * 2, 1);
  const lag = makeHpBarPart(hpBarFillGeo, C.lagColor, 0.55, 11);
  const fill = makeHpBarPart(hpBarFillGeo, C.colorHigh, 1, 12);
  lag.position.x = fill.position.x = -w / 2;
  lag.scale.set(w, h, 1);
  fill.scale.set(w, h, 1);
  group.add(bg, lag, fill);
  scene.add(group);

  // 頭のてっぺん(buildEnemyMesh のボディ位置＋高さの半分)の分だけ上に逃がす。
  // 見下ろしているのでワールドの高さは画面上 camUpDot 倍に潰れて見える。
  // margin は「画面上の隙間」なので潰れない
  const top = isBoss ? def.radius * 2 + 0.4 : def.radius * 1.9;
  return { group, bg, lag, fill, w, up: top * camUpDot + C.margin, lagRatio: 1 };
}

// ワールドの +Y が画面上でどれだけ縦に見えるか(= cos(見下ろし角))
const camUpDot = Math.hypot(camOffset.x, camOffset.z) / camOffset.length();
const hpBarUp = new THREE.Vector3();   // カメラの真上方向(ワールド)。毎フレームの new を避ける

function updateHpBarBoard(bar, ratio, anchor, dt) {
  const C = CONFIG.hpBar;

  // 削れた分は白い帯が少し遅れて追いつく(指数減衰なのでフレームレート非依存)
  if (bar.lagRatio < ratio) bar.lagRatio = ratio;
  else if (C.lagSmoothing > 0) bar.lagRatio += (ratio - bar.lagRatio) * (1 - Math.exp(-dt / C.lagSmoothing));
  else bar.lagRatio = ratio;

  // 足元からカメラの上方向へ逃がす(ワールドの上方向だと見下ろし角で潰れて頭に重なる)
  hpBarUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
  bar.group.position.copy(anchor).addScaledVector(hpBarUp, bar.up);
  bar.group.quaternion.copy(camera.quaternion);   // カメラ正面を向く板にする
  bar.fill.scale.x = bar.w * ratio;
  bar.lag.scale.x = bar.w * bar.lagRatio;
  bar.fill.material.color.setHex(
    ratio <= C.lowRatio ? C.colorLow : ratio <= C.midRatio ? C.colorMid : C.colorHigh
  );
}

function updateHpBar(enemy, dt) {
  updateHpBarBoard(enemy.hpBar, clamp(enemy.hp / enemy.maxHp, 0, 1), enemy.mesh.position, dt);
}

// --- プレイヤーHPバー(敵HPバーの部品・色を共用してキャラのすぐ上に出す)---
const playerHpBar = (() => {
  const C = CONFIG.hpBar, P = C.player;
  const group = new THREE.Group();
  const bg = makeHpBarPart(hpBarBgGeo, C.bgColor, C.bgOpacity, 10);
  bg.scale.set(P.width + C.border * 2, P.height + C.border * 2, 1);
  const lag = makeHpBarPart(hpBarFillGeo, C.lagColor, 0.55, 11);
  const fill = makeHpBarPart(hpBarFillGeo, C.colorHigh, 1, 12);
  lag.position.x = fill.position.x = -P.width / 2;
  lag.scale.set(P.width, P.height, 1);
  fill.scale.set(P.width, P.height, 1);
  group.add(bg, lag, fill);
  group.visible = false;              // タイトル中は隠す(表示は updatePlayerHpBar が握る)
  scene.add(group);
  return { group, lag, fill, w: P.width, up: P.top * camUpDot + C.margin, lagRatio: 1 };
})();

function updatePlayerHpBar(dt) {
  playerHpBar.group.visible = state.phase !== 'title' && state.phase !== 'gameover';
  if (!playerHpBar.group.visible) return;
  updateHpBarBoard(playerHpBar, clamp(player.hp / player.maxHp, 0, 1), player.mesh.position, dt);
}

function buildEnemyMesh(def, isBoss) {
  const group = new THREE.Group();
  const geo = isBoss
    ? new THREE.OctahedronGeometry(def.radius, 0)
    : new THREE.BoxGeometry(def.radius * 1.5, def.radius * 1.8, def.radius * 1.5);
  const body = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: def.color }));
  body.position.y = isBoss ? def.radius + 0.4 : def.radius;
  group.add(body);
  group.userData.body = body;
  return group;
}

function spawnEnemy(typeName, waveNum) {
  const def = ENEMY_TYPES[typeName];
  const isBoss = def.behavior === 'boss';
  const mesh = buildEnemyMesh(def, isBoss);

  // プレイヤーから十分離れたランダム位置にスポーン
  const h = CONFIG.arena.half - 2;
  let pos;
  for (let tries = 0; tries < 20; tries++) {
    pos = new THREE.Vector3((Math.random() * 2 - 1) * h, 0, (Math.random() * 2 - 1) * h);
    if (pos.distanceTo(player.mesh.position) >= CONFIG.wave.spawnMinDist) break;
  }
  mesh.position.copy(pos);
  scene.add(mesh);

  // ボスは出現ウェーブ数に応じた加算、通常敵はウェーブごとの倍率で伸ばす。
  // さらにチャプターの難易度倍率が全体に掛かる
  const ch = chapterDef();
  const baseHp = isBoss
    ? def.hp + (def.hpPerWave || 0) * (waveNum / CONFIG.wave.bossEvery - 1)
    : def.hp * (1 + CONFIG.wave.hpGrowth * (waveNum - 1));
  const hp = Math.round(baseHp * ch.enemyHpMul);
  const useLaser = !!def.laser && waveNum >= def.laser.fromWave;
  const enemy = {
    type: typeName, def, mesh,
    hp, maxHp: hp,
    speedMul: ch.enemySpeedMul,     // チャプターの移動速度倍率(def は共有なので敵側に持つ)
    hpBar: makeHpBar(def, isBoss),
    attackTimer: def.attack ? def.attack.interval * (0.5 + Math.random() * 0.5) : 0,
    telegraphTimer: -1,             // >=0 の間は予兆中
    telegraphRing: def.attack && def.attack.telegraph ? makeTelegraphRing() : null,
    strafeDir: Math.random() < 0.5 ? 1 : -1,
    // テレグラフレーザー(使わない敵は laserFx が null)
    laserFx: useLaser ? makeLaserFx() : null,
    laserPhase: null,               // null | 'telegraph' | 'fire'
    laserT: 0,
    laserTimer: useLaser ? def.laser.interval * (0.5 + Math.random() * 0.5) : 0,
    laserOrigin: new THREE.Vector3(),
    laserDir: new THREE.Vector3(0, 0, 1),
    laserGrazed: false,
    // エレメントの状態異常(applyElems が書き、updateEnemy が進める)
    burnT: 0, burnTick: 0, burnDmg: 0,    // 燃焼: 残り時間 / 次のダメージまで / 1回分のダメージ
    freezeT: 0, freezeCd: 0,              // 凍結: 残り時間 / 再凍結までのクールダウン
    poisonTick: 0, poisonDmg: 0,          // 毒: 次のダメージまで / 毎秒のダメージ(0 なら未感染)
    echoT: 0, echoDmg: 0,                 // 残響の鏃: 発動までの残り / 積まれたダメージ
    swordMarks: 0, markMesh: null,        // 百剣の誓い: 剣印の数 / 頭上の小剣(遅延生成)
    hitFlash: 0, hitSquash: 0,            // 被弾の白フラッシュ / ぷにっと潰れの残り時間
  };
  enemies.push(enemy);
  return enemy;
}

function removeEnemy(enemy) {
  scene.remove(enemy.mesh);
  if (enemy.telegraphRing) scene.remove(enemy.telegraphRing);
  if (enemy.markMesh) { scene.remove(enemy.markMesh); enemy.markMesh = null; }   // ジオメトリ等は共有なので外すだけ
  if (enemy.hpBar) {
    // ジオメトリは共有なのでマテリアルだけ捨てる
    scene.remove(enemy.hpBar.group);
    for (const m of [enemy.hpBar.bg, enemy.hpBar.lag, enemy.hpBar.fill]) m.material.dispose();
    enemy.hpBar = null;
  }
  if (enemy.laserFx) {
    // ジオメトリは共有なのでマテリアルだけ捨てる
    for (const m of [enemy.laserFx.guide, enemy.laserFx.beam, enemy.laserFx.core]) {
      scene.remove(m);
      m.material.dispose();
    }
    enemy.laserFx = null;
  }
  const i = enemies.indexOf(enemy);
  if (i >= 0) enemies.splice(i, 1);
}

// kind: undefined = 直撃(白い数字 + ヒットFX)/ 'crit' = グレイズ強化ショット(金色・大きめ)/
//       'dot' = 燃焼・毒・雷連鎖などの継続/巻き添え(黄色・小さめ。火花は出さない)
function damageEnemy(enemy, amount, kind) {
  enemy.hp -= amount;
  const body = enemy.mesh.userData.body;
  // 被弾の白フラッシュとぷにっと潰れ(タイマーは updateEnemy が進める)
  enemy.hitFlash = CONFIG.fx.hitFlash;
  if (kind !== 'dot') {
    enemy.hitSquash = CONFIG.fx.hitSquash.time;
    spawnHitFx(enemy.mesh.position, body.position.y, kind === 'crit' ? 1.5 : 1);
  }
  // 与ダメージを数値で出す(removeEnemy より先に。死んだ敵の位置は取れなくなる)。
  // 胴の高さは見下ろし角で画面上 camUpDot 倍に潰れるので、そこだけ掛けて補正する
  spawnDamageText(
    enemy.mesh.position, amount, body.position.y * camUpDot + 0.3,
    enemy.hpBar.w / 2 + CONFIG.damageText.jitter, kind
  );
  if (enemy.hp <= 0) {
    state.score += enemy.def.score;
    gainExp(enemy.def.exp || 0);    // レベルアップはキューに積むだけ(3択は animate が開く)
    const ex = enemy.mesh.position.x, ez = enemy.mesh.position.z;
    const ey = body.position.y, er = enemy.def.radius;
    removeEnemy(enemy);
    spawnDeathFx(ex, ez, ey, er);   // 撃破の弾け(敵が消えた位置に出す)
    onKillArts(ex, ez);             // 弔いの星(倒した位置に落とす)
    updateHud();
    if (enemies.length === 0 && state.phase === 'playing') onWaveClear();
  }
}

function fireEnemyAttack(enemy) {
  const atk = enemy.def.attack;
  const dirs = BULLET_PATTERNS[atk.pattern](enemy, player.mesh.position);
  const origin = enemy.mesh.position.clone();
  origin.y = 0.9;
  for (const d of dirs) {
    const b = spawnFromPool(bulletPool, origin, d, atk.speed * chapterDef().bulletSpeedMul, atk.damage);
    if (b) b.owner = enemy;           // 見切りの星がこの弾の主へ撃ち返す
  }
}

function updateEnemy(enemy, dt) {
  const def = enemy.def;
  const pos = enemy.mesh.position;

  // --- エレメントの状態異常 ---
  // 継続ダメージも damageEnemy() を通す(数値表示・撃破処理を経由させる)。
  // 倒れたら removeEnemy 済み(hpBar が null)なので、以降の処理には入らない
  const E = CONFIG.arts.elements;
  if (enemy.freezeCd > 0) enemy.freezeCd -= dt;
  if (enemy.burnT > 0) {
    enemy.burnT -= dt;
    enemy.burnTick += dt;
    if (enemy.burnTick >= E.fire.tickEvery) {
      enemy.burnTick = 0;
      damageEnemy(enemy, enemy.burnDmg, 'dot');
      if (!enemy.hpBar) return;           // 燃え尽きた
    }
  }
  if (enemy.poisonDmg > 0) {
    enemy.poisonTick += dt;
    if (enemy.poisonTick >= E.poison.tickEvery) {
      enemy.poisonTick = 0;
      damageEnemy(enemy, enemy.poisonDmg, 'dot');
      if (!enemy.hpBar) return;           // 毒で倒れた
    }
  }
  // 残響の鏃: 矢のヒットの一拍あと、積んだ分をまとめて響かせる
  if (enemy.echoDmg > 0) {
    enemy.echoT -= dt;
    if (enemy.echoT <= 0) {
      const d = enemy.echoDmg;
      enemy.echoDmg = 0;
      damageEnemy(enemy, d, 'dot');
      if (!enemy.hpBar) return;           // 残響で倒れた
    }
  }
  const frozen = enemy.freezeT > 0;
  if (frozen) enemy.freezeT -= dt;
  // 発光は毎フレーム決め直す: 被弾の白フラッシュ > 凍結の青 > 消灯。
  // タイマー式なので setTimeout と違いポーズ中に勝手に進まない
  const bodyMat = enemy.mesh.userData.body.material;
  if (enemy.hitFlash > 0) enemy.hitFlash -= dt;
  bodyMat.emissive.setHex(enemy.hitFlash > 0 ? 0xb8b8b8 : frozen ? 0x2255aa : 0x000000);
  // 被弾のぷにっと潰れ: 山なりに横へ膨らみ縦に縮む(当たり判定には影響しない)
  // 剣印(百剣の誓い): 頭上で回る小剣。数は大きさで伝える
  if (enemy.markMesh) {
    enemy.markMesh.visible = enemy.swordMarks > 0;
    if (enemy.swordMarks > 0) {
      enemy.markMesh.position.set(pos.x, 2.1, pos.z);
      enemy.markMesh.rotation.y += dt * 4;
      enemy.markMesh.scale.setScalar(0.55 + 0.25 * enemy.swordMarks);
    }
  }
  const sq = CONFIG.fx.hitSquash;
  if (enemy.hitSquash > 0) {
    enemy.hitSquash -= dt;
    const k = Math.sin(Math.max(0, enemy.hitSquash / sq.time) * Math.PI) * sq.amount;
    enemy.mesh.scale.set(1 + k, 1 - k * 0.7, 1 + k);
  } else {
    enemy.mesh.scale.setScalar(1);
  }

  const toPlayer = new THREE.Vector3().subVectors(player.mesh.position, pos);
  toPlayer.y = 0;
  const dist = toPlayer.length();
  if (dist > 0.001) toPlayer.normalize();

  // --- 移動 ---
  let moveVec = null;
  if (def.behavior === 'chase') {
    moveVec = toPlayer;
  } else if (def.behavior === 'shoot') {
    // 距離を保ちながら横に回り込む
    if (dist > def.keepDistance + 1) moveVec = toPlayer.clone();
    else if (dist < def.keepDistance - 1) moveVec = toPlayer.clone().negate();
    else moveVec = new THREE.Vector3(-toPlayer.z, 0, toPlayer.x).multiplyScalar(enemy.strafeDir * 0.6);
  } else if (def.behavior === 'boss') {
    if (enemy.telegraphTimer < 0) moveVec = toPlayer; // 予兆中は停止
  }
  // レーザー中は足を止める(発射点も角度も固定なので、動くと線と実際のビームがずれる)
  if (enemy.laserPhase) moveVec = null;
  if (moveVec && !frozen) {
    pos.addScaledVector(moveVec, def.speed * enemy.speedMul * dt);
    const h = CONFIG.arena.half - def.radius;
    pos.x = Math.max(-h, Math.min(h, pos.x));
    pos.z = Math.max(-h, Math.min(h, pos.z));
  }
  enemy.mesh.lookAt(player.mesh.position.x, pos.y, player.mesh.position.z);
  if (def.behavior === 'boss') enemy.mesh.userData.body.rotation.y += dt * 1.5;

  // --- 攻撃 ---(凍結中は予兆もタイマーも止まる)
  const atk = def.attack;
  if (atk && !frozen) {
    if (enemy.telegraphTimer >= 0) {
      // 予兆中: 赤リングを拡大
      enemy.telegraphTimer += dt;
      const t = Math.min(enemy.telegraphTimer / atk.telegraph, 1);
      const ring = enemy.telegraphRing;
      ring.visible = true;
      ring.position.set(pos.x, 0.05, pos.z);
      ring.scale.setScalar(0.3 + t * atk.telegraphRadius);
      ring.material.opacity = 0.4 + 0.5 * Math.sin(state.time * 20);
      if (t >= 1) {
        ring.visible = false;
        enemy.telegraphTimer = -1;
        fireEnemyAttack(enemy);
      }
    } else {
      enemy.attackTimer -= dt;
      if (enemy.attackTimer <= 0) {
        enemy.attackTimer = atk.interval;
        if (atk.telegraph) enemy.telegraphTimer = 0;  // 予兆開始
        else fireEnemyAttack(enemy);                  // 即時発射
      }
    }
  }
  // 凍結中は新しいレーザーを始めない(予兆・発射が既に動いているものは最後まで通す)
  if (enemy.laserFx && (enemy.laserPhase || !frozen)) updateLaser(enemy, dt);
  updateHpBar(enemy, dt);

  // --- 接触ダメージ ---
  if (dist < def.radius + CONFIG.player.radius) {
    damagePlayer(def.touchDamage);
  }
}

// =====================================================================
// ウェーブ管理
// =====================================================================
// いま挑戦中のチャプター定義
function chapterDef() {
  return CONFIG.chapters[state.chapter];
}

// そのウェーブがチャプターの最終ウェーブか(エンドレス継続中は最終ウェーブなし)
function isFinalWave(n) {
  return !state.endless && n >= chapterDef().waves;
}

function startWave(n) {
  state.wave = n;
  const isBossWave = n % CONFIG.wave.bossEvery === 0;
  if (isBossWave) {
    spawnEnemy('boss', n);
    const escorts = 2 + Math.floor(n / CONFIG.wave.bossEvery);
    for (let i = 0; i < escorts; i++) spawnEnemy('chaser', n);
    showWaveBanner(isFinalWave(n) ? 'FINAL WAVE  - BOSS -' : 'WAVE ' + n + '  - BOSS -');
  } else {
    const count = Math.min(
      CONFIG.wave.maxCount,
      CONFIG.wave.baseCount + (n - 1) * CONFIG.wave.countPerWave
    );
    for (let i = 0; i < count; i++) {
      spawnEnemy(n >= 2 && i % 3 === 2 ? 'shooter' : 'chaser', n);
    }
    showWaveBanner(isFinalWave(n) ? 'FINAL WAVE' : 'WAVE ' + n);
  }
  updateHud();
}

function onWaveClear() {
  const final = isFinalWave(state.wave);
  if (!final) player.hp = Math.min(player.maxHp, player.hp + CONFIG.wave.clearHeal);
  clearPool(bulletPool);
  updateHud();
  showWaveBanner(final ? chapterDef().name + ' CLEAR!' : 'WAVE CLEAR!  +' + CONFIG.wave.clearHeal + ' HP');
  setTimeout(() => {
    if (state.phase === 'playing') advanceWave();
    // スキル選択中なら、閉じたとき(closeLevelUp)に次へ進む
    else if (state.phase === 'levelup') state.waveQueued = true;
  }, 1600);
}

// ウェーブクリア後の行き先。最終ウェーブならチャプタークリア画面へ。
// onWaveClear の setTimeout と closeLevelUp の両方から呼ばれる唯一の入口
function advanceWave() {
  if (isFinalWave(state.wave)) chapterClear();
  else startWave(state.wave + 1);
}

// 入力(キーボード + 仮想ジョイスティック)
// =====================================================================
const input = { x: 0, z: 0 };
const keys = {};

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();   // ページのスクロールは止める
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

const joyEl = document.getElementById('joystick');
const joyKnob = document.getElementById('joy-knob');
const joy = { active: false, id: null, ox: 0, oy: 0, x: 0, z: 0 };
const JOY_RANGE = 50;
const JOY_DEADZONE = 8;   // タッチ直後の指ブレ(数px)であらぬ方向へ一歩出ないための遊び

function joyStart(x, y, id) {
  joy.active = true; joy.id = id;
  joy.ox = x; joy.oy = y;
  joyEl.style.display = 'block';
  joyEl.style.left = x + 'px';
  joyEl.style.top = y + 'px';
  joyKnob.style.left = '0px';
  joyKnob.style.top = '0px';
}
function joyMove(x, y) {
  let dx = x - joy.ox, dy = y - joy.oy;
  const len = Math.hypot(dx, dy);
  if (len > JOY_RANGE) {
    // フローティング式: 範囲を超えた分だけ原点を指に引きずる。
    // 原点が固定だと、大きく倒したあとの切り返しが原点を跨ぐまで反映されず
    // 「入れた向きと違う方へ走る」ことがある。追従させれば常に直近の指の向きになる
    const k = (len - JOY_RANGE) / len;
    joy.ox += dx * k; joy.oy += dy * k;
    joyEl.style.left = joy.ox + 'px';
    joyEl.style.top = joy.oy + 'px';
    dx -= dx * k; dy -= dy * k;
  }
  joyKnob.style.left = dx + 'px';
  joyKnob.style.top = dy + 'px';
  const dead = Math.hypot(dx, dy) <= JOY_DEADZONE;
  joy.x = dead ? 0 : dx / JOY_RANGE;
  joy.z = dead ? 0 : dy / JOY_RANGE;
}
function joyEnd() {
  joy.active = false; joy.id = null; joy.x = 0; joy.z = 0;
  joyEl.style.display = 'none';
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (!joy.active) {
    const t = e.changedTouches[0];
    joyStart(t.clientX, t.clientY, t.identifier);
  }
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) joyMove(t.clientX, t.clientY);
  }
}, { passive: false });
['touchend', 'touchcancel'].forEach((ev) =>
  canvas.addEventListener(ev, (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) joyEnd();
    }
  })
);

// iOS Safari のダブルタップズーム・ピンチズーム抑止
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd < 350) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

function readInput() {
  let x = 0, z = 0;
  if (keys['KeyW'] || keys['ArrowUp']) z -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) z += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) x -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) x += 1;
  if (joy.active) { x += joy.x; z += joy.z; }
  const len = Math.hypot(x, z);
  if (len > 1) { x /= len; z /= len; }
  input.x = x; input.z = z;
}

// ゲームループ
// =====================================================================
const state = {
  phase: 'title',   // 'title' | 'playing' | 'levelup' | 'gameover' | 'clear'
  chapter: 0,       // 挑戦中のチャプター(CONFIG.chapters の添字)
  wave: 1,
  score: 0,
  time: 0,
  waveQueued: false,   // スキル選択でウェーブ開始を保留した印
  endless: false,      // チャプタークリア後に「このまま続ける」を選んだ状態
};
const clock = new THREE.Clock();

function nearestEnemy() {
  let best = null, bestD = Infinity;
  for (const e of enemies) {
    const d = e.mesh.position.distanceToSquared(player.mesh.position);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

function updatePlayer(dt) {
  readInput();
  const moving = Math.hypot(input.x, input.z) > 0.05;
  player.moving = moving;
  const pos = player.mesh.position;

  if (moving) {
    const speed = CONFIG.player.speed * level.stats.speedMul;
    pos.x += input.x * speed * dt;
    pos.z += input.z * speed * dt;
    const h = CONFIG.arena.half - CONFIG.player.radius;
    pos.x = Math.max(-h, Math.min(h, pos.x));
    pos.z = Math.max(-h, Math.min(h, pos.z));
    // rotation.y だけの上書きにしない: 停止中の lookAt(オート照準)は向きによって
    // オイラー角を (x=π, y', z=π) の表現で残すことがあり、y だけ書き換えると
    // x/z の π が残ってキャラが鏡写しの向きで走ってしまう
    player.mesh.rotation.set(0, Math.atan2(input.x, input.z), 0);
    player.fireTimer = Math.min(player.fireTimer, 0.15); // 停止直後すぐ撃てるように
  } else {
    // 停止中: 最寄りの敵へオート攻撃
    const target = nearestEnemy();
    if (target) {
      player.mesh.lookAt(target.mesh.position.x, 0, target.mesh.position.z);
      // ラピッドショットは攻撃速度アップ
      const interval = CONFIG.player.fireInterval / level.stats.fireMul;
      player.fireTimer -= dt;
      if (player.fireTimer <= 0) {
        player.fireTimer = interval;
        const dir = new THREE.Vector3()
          .subVectors(target.mesh.position, pos);
        dir.y = 0; dir.normalize();
        const origin = pos.clone(); origin.y = 0.95;   // 弓を構える高さ
        firePlayerShot(origin, dir);                   // スキル(マルチ/バック/サイド等)込みで発射
        player.anim.release = 1;                       // 弦を放つ(フォロースルー開始)
      }
      // 弓の引きは発射サイクルに同期: 序盤の drawPortion で引き切り、
      // 残りは引き絞ったまま溜め、fireTimer が尽きた瞬間に放つ。
      // 停止直後は fireTimer が interval より短く丸められている(すぐ撃てる)ので clamp
      const progress = 1 - clamp(player.fireTimer / interval, 0, 1);
      player.anim.drawGoal = Math.min(1, progress / CONFIG.player.bow.drawPortion);
    } else {
      player.anim.drawGoal = 0;
    }
    player.aiming = !!target;
  }
  if (moving) { player.aiming = false; player.anim.drawGoal = 0; }

  if (player.invincible > 0) {
    player.invincible -= dt;
    player.mesh.visible = Math.floor(state.time * 16) % 2 === 0; // 点滅
  } else {
    player.mesh.visible = true;
  }


  updatePlayerAnimation(dt);
}

// 隼の瞳(矢の追尾): 最寄りの敵へ向けて旋回する。貫通でヒット済みの敵は狙い直さない
const _homTmp = new THREE.Vector3();
function steerArrow(b, dt) {
  const p = b.mesh.position;
  let best = null, bestD = Infinity;
  for (const e of enemies) {
    if (b.hits && b.hits.has(e)) continue;
    const dx = e.mesh.position.x - p.x, dz = e.mesh.position.z - p.z;
    const d = dx * dx + dz * dz;
    if (d < bestD) { bestD = d; best = e; }
  }
  if (!best) return;
  const cur = Math.atan2(b.vel.z, b.vel.x);
  const want = Math.atan2(best.mesh.position.z - p.z, best.mesh.position.x - p.x);
  let diff = want - cur;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  const maxTurn = SKILLS.homing.turnRate * dt;
  const a = cur + Math.max(-maxTurn, Math.min(maxTurn, diff));
  const sp = Math.hypot(b.vel.x, b.vel.z);
  b.vel.x = Math.cos(a) * sp;
  b.vel.z = Math.sin(a) * sp;
  _homTmp.copy(p).add(b.vel);
  b.mesh.lookAt(_homTmp);
  b.mesh.rotateX(Math.PI / 2);
}

function updateProjectiles(dt) {
  const st = level.stats;
  const h = CONFIG.arena.half + 3;
  // プレイヤーの矢・守護者の弾 → 敵
  for (const pool of playerShotPools) {
    for (const b of pool) {
      if (!b.active) continue;
      if (st.homing && pool === arrowPool && enemies.length > 0) steerArrow(b, dt);
      b.mesh.position.addScaledVector(b.vel, dt);
      b.life -= dt;
      const p = b.mesh.position;
      if (b.life <= 0 || Math.abs(p.x) > h || Math.abs(p.z) > h) { deactivate(b); continue; }
      // 月蝕: 矢は触れた敵弾をかき消す(グレイズ成立扱い)
      if (st.eclipse && pool === arrowPool) eclipseEat(p, 0.35 * st.arrowHitMul);
      // damageEnemy が removeEnemy(splice)を呼ぶので、敵は後ろから回す
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        const r = e.def.radius + 0.25 * (pool === arrowPool ? st.arrowHitMul : 1);   // 大鏃で太る
        if (p.distanceToSquared(e.mesh.position.clone().setY(p.y)) >= r * r) continue;
        if (b.hits && b.hits.has(e)) continue;   // 貫通した敵に次のフレームで多重ヒットしない
        // 属性を先に付与する(とどめの一撃でも雷の連鎖は起きる)。
        // 連鎖がこの敵自身を倒すことはない(chainLightning は当てた敵を除く)が、
        // 巻き添えで敵配列が縮むことはあるので damageEnemy 側の生存確認に hpBar を使う
        applyElems(e, b.damage, b.elems);
        if (e.hpBar) damageEnemy(e, b.damage, b.crit ? 'crit' : undefined);
        if (e.hpBar) arts.lastHit = e;           // 導きの銘: 最後に当てた敵を覚える
        // 残響の鏃: 矢のヒットは一拍おいてもう一度響く(敵側に積んで updateEnemy が鳴らす)
        if (st.echo && pool === arrowPool && e.hpBar) {
          e.echoT = st.echo.delay;
          e.echoDmg += b.damage * st.echo.ratio;
        }
        // 命の芽吹き: ヒットするたび確率でHP回復(矢・守護者の弾どちらでも発動)
        if (level.stats.regenChance > 0 && player.hp < player.maxHp && Math.random() < level.stats.regenChance) {
          player.hp = Math.min(player.maxHp, player.hp + SKILLS.regen.value);
          updateHud();
        }
        if (b.pierce > 0) {                      // 貫通スキル: 消えずに突き抜ける
          b.pierce--;
          (b.hits || (b.hits = new Set())).add(e);
        } else {
          deactivate(b);
          break;
        }
      }
    }
  }
  // 敵弾 → プレイヤー(被弾判定とグレイズ判定を同じループで見る)
  const pr = CONFIG.player.radius + 0.22;
  const gzIn = CONFIG.graze.innerRadius * CONFIG.graze.innerRadius;
  const gzR = CONFIG.graze.outerRadius * st.grazeRange;   // 弾幕遊戯で広がる
  const gzOut = gzR * gzR;
  const pp = player.mesh.position;
  // 明鏡止水: チャージ満タンの間、すべての敵弾が遅くなる
  const mirrorSlow = st.mirror && graze.charges >= grazeChargeCap() ? st.mirror.bulletSlow : 1;
  for (const b of bulletPool) {
    if (!b.active) continue;
    // 間合いの妙: グレイズリングの内側では敵弾がさらに遅くなる(移動前の位置で判定)
    let mv = mirrorSlow;
    if (st.maai) {
      const mdx = b.mesh.position.x - pp.x, mdz = b.mesh.position.z - pp.z;
      if (mdx * mdx + mdz * mdz <= gzOut) mv *= st.maai.slow;
    }
    b.mesh.position.addScaledVector(b.vel, dt * mv);
    b.life -= dt;
    const p = b.mesh.position;
    if (b.life <= 0 || Math.abs(p.x) > h || Math.abs(p.z) > h) { deactivate(b); continue; }
    const dx = p.x - pp.x, dz = p.z - pp.z;
    const d2 = dx * dx + dz * dz;
    if (d2 < pr * pr) {
      deactivate(b);
      damagePlayer(b.damage);
      continue;
    }
    // グレイズ: 至近まで寄って(near)、当たらずに抜けた瞬間に成立。
    // 当たった弾はここに来る前に deactivate されるので、被弾がグレイズを兼ねることはない。
    // grazed フラグで1発につき1回だけ数える
    if (!b.grazed) {
      if (d2 >= gzIn && d2 <= gzOut) b.near = true;
      else if (b.near) { b.grazed = true; onGraze(b.owner); }
    }
  }
}

// --- 三日月刃(弦月の構え)の更新 ---
// 矢と違い「触れている間、tickInterval ごとに刻む」ので一撃判定のループには乗せない。
// 1回の刻みで重なっている敵全員にヒットし、1体につき寿命(grind)を1消費。尽きたら砕ける
function updateCrescents(dt) {
  const st = level.stats;
  const cs = st.crescent;
  const h = CONFIG.arena.half + 3;
  for (const b of crescentPool) {
    if (!b.active) continue;
    if (st.homing && enemies.length > 0) steerArrow(b, dt);   // 隼の瞳: 刃が敵に張り付く
    b.mesh.position.addScaledVector(b.vel, dt);
    b.life -= dt;
    const p = b.mesh.position;
    if (!cs || b.life <= 0 || Math.abs(p.x) > h || Math.abs(p.z) > h) { deactivate(b); continue; }
    // 開口部を常に後方へ(自転はさせない: 追尾中も進行方向が読めるように)
    b.mesh.rotation.set(-Math.PI / 2, 0, Math.atan2(b.vel.z, -b.vel.x) - (Math.PI + CRESCENT_ARC / 2));
    // 月蝕: 刃の全面が敵弾を食う
    if (st.eclipse) eclipseEat(p, cs.radius * b.scaleMul + 0.22);
    b.tickT -= dt;
    if (b.tickT <= 0) {
      b.tickT = cs.tickInterval * (st.echo ? 0.5 : 1);        // 残響の鏃: 刻みが倍速に変質
      const r = cs.radius * b.scaleMul;
      for (let ei = enemies.length - 1; ei >= 0 && b.grind > 0; ei--) {
        const e = enemies[ei];
        const rr = r + e.def.radius;
        const dx = e.mesh.position.x - p.x, dz = e.mesh.position.z - p.z;
        if (dx * dx + dz * dz >= rr * rr) continue;
        applyElems(e, b.damage * cs.tickMul, b.elems);
        if (e.hpBar) damageEnemy(e, b.damage * cs.tickMul, b.crit ? 'crit' : 'dot');
        if (e.hpBar) arts.lastHit = e;           // 導きの銘: 刃の研削でも狙い先を更新
        if (st.regenChance > 0 && player.hp < player.maxHp && Math.random() < st.regenChance) {
          player.hp = Math.min(player.maxHp, player.hp + SKILLS.regen.value);
          updateHud();
        }
        b.grind--;
      }
      if (b.grind <= 0) {             // 寿命切れ: 砕ける
        spawnFlash(p.x, 0.6, p.z, CONFIG.fx.muzzle.size * 1.3, 0xffedb0);
        deactivate(b);
        continue;
      }
    }
    // 寿命が減るほどグローが暗くなり、グレイズで回復した瞬間は白く瞬く
    if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 5);
    const u = b.mesh.userData;
    u.glowMat.opacity = 0.12 + 0.3 * clamp(b.grind / cs.lifeMax, 0, 1) + 0.5 * b.flash;
    u.coreMat.color.setHex(b.flash > 0.05 ? 0xffffff : 0xffedb0);
  }
}

// 月蝕: 中心 p・半径 r に入った敵弾をかき消し、1発ごとにグレイズ成立扱いにする
// (チャージ加算・見切りの星・刃の寿命回復まで、通常のグレイズと同じ経路を通る)
function eclipseEat(p, r) {
  for (const eb of bulletPool) {
    if (!eb.active) continue;
    const dx = eb.mesh.position.x - p.x, dz = eb.mesh.position.z - p.z;
    if (dx * dx + dz * dz >= r * r) continue;
    spawnFlash(eb.mesh.position.x, 0.5, eb.mesh.position.z, CONFIG.fx.muzzle.size * 0.7, 0xcfe8ff);
    const owner = eb.owner;
    deactivate(eb);
    onGraze(owner);
  }
}

// プレイヤーに対して固定オフセットを保つ。followSmoothing が 0 なら遅れなしの完全追従で、
// 画面の流れが入力と 1:1 になる(遅れて滑り込む動きは酔いの原因になるため既定は 0)
function updateCamera(dt) {
  const c = CONFIG.camera;
  const p = player.mesh.position;
  const tx = p.x + camOffset.x, ty = camOffset.y, tz = p.z + camOffset.z;
  // 指数減衰なのでフレームレートが変わっても追従の速さは一定
  const s = c.followSmoothing > 0 ? 1 - Math.exp(-dt / c.followSmoothing) : 1;
  camera.position.x += (tx - camera.position.x) * s;
  camera.position.y += (ty - camera.position.y) * s;
  camera.position.z += (tz - camera.position.z) * s;
  camera.lookAt(p.x, 0, p.z);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  state.time += dt;

  // レベルアップはフレーム頭で処理する(敵ループの途中で phase を変えないため)。
  // 'levelup' の間は下の更新が止まる = ゲームがポーズされる
  if (state.phase === 'playing' && level.pending > 0) openLevelUp();

  if (state.phase === 'playing') {
    updatePlayer(dt);
    for (let i = enemies.length - 1; i >= 0; i--) updateEnemy(enemies[i], dt);
    updateProjectiles(dt);
    updateCrescents(dt);
    updateArts(dt);
    updateGrazeFx(dt);
    updateFx(dt);
    updateDamageTexts(dt);
    updateDust(dt);
  }
  updateCamera(dt);
  updatePlayerHpBar(dt);
  renderer.render(scene, camera);
}

// チャプターの解放状況(クリア済みチャプター数)。localStorage が使えない環境では実行中だけ保持
const PROGRESS_KEY = 'bulletArcher.cleared';
let clearedChapters = 0;
try {
  clearedChapters = Math.min(CONFIG.chapters.length, parseInt(localStorage.getItem(PROGRESS_KEY), 10) || 0);
} catch (e) { /* プライベートモード等 */ }
function saveProgress() {
  try { localStorage.setItem(PROGRESS_KEY, clearedChapters); } catch (e) { /* 保存できなくても続行 */ }
}

// タイトルのチャプター選択。クリア済みの次のチャプターまで解放される
function renderChapterSelect() {
  chapterSelectEl.innerHTML = '';
  CONFIG.chapters.forEach((ch, i) => {
    const unlocked = i <= clearedChapters;
    const btn = document.createElement('button');
    btn.className = 'chapter-btn' + (unlocked ? '' : ' locked');
    btn.innerHTML = unlocked
      ? '<span class="c-name">' + ch.name + '</span><span class="c-sub">' + ch.subtitle + '</span>'
      : '<span class="c-name">🔒 ' + ch.name + '</span><span class="c-sub">' + CONFIG.chapters[i - 1].name + ' をクリアで解放</span>';
    if (unlocked) btn.addEventListener('click', () => startGame(i));
    else btn.disabled = true;
    chapterSelectEl.appendChild(btn);
  });
}

function updateHud() {
  hpLabel.textContent = 'HP ' + Math.ceil(player.hp) + ' / ' + player.maxHp;
  chapterLabel.textContent = chapterDef().name;
  // チャプター中は残りが分かるように「/ 最終ウェーブ」を出す(エンドレスでは番号だけ)
  waveLabel.textContent = state.endless
    ? 'WAVE ' + state.wave
    : 'WAVE ' + state.wave + ' / ' + chapterDef().waves;
  scoreLabel.textContent = 'SCORE ' + state.score;
  updateGrazeHud();
}

// グレイズのチャージ表示。チャージがある間はバーが金色に点滅し、次の攻撃の倍率を出す
function updateGrazeHud() {
  const cap = grazeChargeCap();
  const charged = graze.charges > 0;
  grazeBar.style.width = (graze.charges / cap * 100) + '%';
  grazeBar.classList.toggle('full', charged);
  grazeLabel.classList.toggle('full', charged);
  if (level.stats.zanshin) {
    // 残心: 消費しない常時倍率を表示(被弾で失う緊張感はバーの伸びで伝わる)
    grazeLabel.textContent = '残心 ×' + (Math.round(zanshinMul() * 100) / 100) +
      '  (チャージ ' + graze.charges + '/' + cap + ')';
  } else {
    grazeLabel.textContent = charged
      ? '次の攻撃 ×' + (Math.round(grazeShotMul() * 10) / 10) + '  (チャージ ' + graze.charges + ')'
      : 'GRAZE で次の攻撃を強化';
  }
}

// 経験値バーと Lv 表示
function updateExpHud() {
  expBar.style.width = (level.exp / level.next * 100) + '%';
  expLabel.textContent = 'Lv ' + level.lv + '  EXP ' + Math.floor(level.exp) + ' / ' + level.next;
}

// ---- レベルアップ(スキル3択)画面 ----
// pending が残っていれば選ぶたびに次の3択を出し直す。全部選び終わるまで 'levelup' のまま
let levelupPicks = [];   // いま表示中のスキルid(キー 1/2/3 用)

// requires ゲート: 属性・強化スキルは、そのファミリーの生成スキル(family フィールド持ち)を
// 1つでも取っているときだけ抽選に並ぶ。'summon' はどれかのファミリーを持っていれば良い
function familyOwned(fam) {
  if (fam === 'summon') return familyOwned('star') || familyOwned('sword') || familyOwned('guardian');
  return Object.keys(SKILLS).some((id) => SKILLS[id].family === fam && (level.taken[id] || 0) > 0);
}

const availableSkills = () =>
  Object.keys(SKILLS).filter((id) => {
    const s = SKILLS[id];
    if ((level.taken[id] || 0) >= s.max) return false;
    return !s.requires || familyOwned(s.requires);
  });

// レアリティの重み付き抽選: pool(未MAXスキルid)を段ごとに分け、候補が
// 残っている段だけで重みを引き、**その段の候補一覧**を返す。3択はこの1段の
// 中からだけ作るので、提示されるスキルのレア度は毎回必ず揃う
function rollRarityTier(pool) {
  const tiers = {};
  pool.forEach((id) => {
    const r = SKILLS[id].rarity;
    (tiers[r] || (tiers[r] = [])).push(id);
  });
  let total = 0;
  for (const r in tiers) total += CONFIG.level.rarity[r].weight;
  let roll = Math.random() * total;
  for (const r in tiers) {
    roll -= CONFIG.level.rarity[r].weight;
    if (roll < 0) return tiers[r];
  }
  return tiers[Object.keys(tiers)[0]];   // 浮動小数の端数の保険
}

// レア以上を引いた回の昇格演出: 光球が common から引いた段まで色を1段ずつ
// 纏って弾み、最後は段の色でバーストして消える。カードが出始めるまでの秒数を
// 返す(コモンは演出なしで 0)。ゲームは levelup ポーズ中なので setTimeout でよい
const rarityTeaseEl = document.getElementById('rarity-tease');
const teaseTimers = [];
function clearRarityTease() {
  teaseTimers.forEach(clearTimeout);
  teaseTimers.length = 0;
  rarityTeaseEl.style.display = 'none';
  rarityTeaseEl.classList.remove('step', 'final');
}
function playRarityTease(tierRank) {
  clearRarityTease();
  if (tierRank <= 0) return 0;
  const keys = Object.keys(CONFIG.level.rarity).slice(0, tierRank + 1);
  const step = 0.55;                 // 1段ごとの間隔(秒)
  rarityTeaseEl.style.display = 'block';
  keys.forEach((k, i) => {
    teaseTimers.push(setTimeout(() => {
      rarityTeaseEl.style.setProperty('--tc', CONFIG.level.rarity[k].color);
      rarityTeaseEl.classList.remove('step', 'final');
      void rarityTeaseEl.offsetWidth;          // アニメーションを再生し直す
      rarityTeaseEl.classList.add(i === keys.length - 1 ? 'final' : 'step');
    }, i * step * 1000));
  });
  const total = (keys.length - 1) * step + 0.55;   // 最後のバーストが終わるまで
  teaseTimers.push(setTimeout(clearRarityTease, total * 1000));
  return (keys.length - 1) * step + 0.25;   // バーストの途中からカードを出し始める
}

function openLevelUp() {
  const pool = availableSkills();
  if (pool.length === 0) { level.pending = 0; return; }   // 全スキル取り切り
  state.phase = 'levelup';
  joyEnd();                          // 動きっぱなしで再開しないように入力を切る

  // 段を1つ引き、その段の中からシャッフルで choices 件。段の候補が3未満の
  // とき(エピック以上や終盤の取り切り)はある分だけ出す(レア度は崩さない)
  const tierPool = rollRarityTier(pool);
  for (let i = tierPool.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [tierPool[i], tierPool[j]] = [tierPool[j], tierPool[i]];
  }
  levelupPicks = tierPool.slice(0, CONFIG.level.choices);

  // 札の枚数に合わせて列数と全体幅を絞る(1〜2枚でも中央で自然な大きさ)
  skillCardsEl.style.gridTemplateColumns = 'repeat(' + levelupPicks.length + ', 1fr)';
  skillCardsEl.style.maxWidth = (240 * levelupPicks.length) + 'px';

  // 出現演出の溜め: レア度が高い段ほど1枚ごとの間隔を長くして期待感を作る。
  // レア以上は先に昇格演出(色が段々上がる光球)を流し、カードはその後から出す
  const rarityRank = (id) => Object.keys(CONFIG.level.rarity).indexOf(SKILLS[id].rarity);

  skillCardsEl.innerHTML = '';
  let inDelay = playRarityTease(rarityRank(levelupPicks[0]));
  levelupPicks.forEach((id, i) => {
    const s = SKILLS[id];
    const r = CONFIG.level.rarity[s.rarity];
    const cur = level.taken[id] || 0;
    if (i > 0) inDelay += 0.12 + rarityRank(id) * 0.14;
    const card = document.createElement('button');
    card.className = 'skill-card rarity-' + s.rarity;
    card.style.setProperty('--rc', r.color);   // 枠・ラベル・発光の色は CSS 側で var(--rc) 参照
    card.style.setProperty('--in-delay', inDelay.toFixed(2) + 's');
    card.innerHTML =
      '<div class="s-rarity">' + r.label + '</div>' +
      '<div class="s-icon">' + s.icon + '</div>' +
      '<div class="s-name">' + s.name + '</div>' +
      '<div class="s-desc">' + s.desc + '</div>' +
      '<div class="s-lv">' + (cur > 0 ? 'Lv ' + cur + ' → ' + (cur + 1) : 'NEW') + ' / MAX ' + s.max + '</div>';
    card.addEventListener('click', () => chooseSkill(id));
    skillCardsEl.appendChild(card);
  });
  levelupScreen.style.display = 'flex';
}

function chooseSkill(id) {
  if (state.phase !== 'levelup') return;
  takeSkill(id);
  level.pending--;
  if (level.pending > 0 && availableSkills().length > 0) {
    openLevelUp();                   // まとめてレベルアップした分は続けて選ぶ
    return;
  }
  level.pending = 0;
  closeLevelUp();
}

function closeLevelUp() {
  clearRarityTease();                // 演出の途中で選んでも光球を残さない
  levelupScreen.style.display = 'none';
  state.phase = 'playing';
  updateHud();
  // 選択中にウェーブクリアの遷移が来ていたらここで進める
  if (state.waveQueued) {
    state.waveQueued = false;
    advanceWave();
  }
}

// キーボードでも選べる(1 / 2 / 3)
window.addEventListener('keydown', (e) => {
  if (state.phase !== 'levelup') return;
  const i = ['Digit1', 'Digit2', 'Digit3'].indexOf(e.code);
  if (i >= 0 && levelupPicks[i]) chooseSkill(levelupPicks[i]);
});

let bannerTimeout = null;
function showWaveBanner(text) {
  waveBanner.textContent = text;
  waveBanner.style.opacity = '1';
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(() => { waveBanner.style.opacity = '0'; }, 1400);
}

function startGame(chapterIndex) {
  state.chapter = chapterIndex;
  applyChapterVisual(chapterDef());
  while (enemies.length) removeEnemy(enemies[0]);
  clearPool(arrowPool);
  clearPool(crescentPool);
  clearPool(bulletPool);
  resetPlayer();
  state.score = 0;
  state.phase = 'playing';
  state.waveQueued = false;
  state.endless = false;
  resetGraze();
  resetLevel();
  resetArts();                       // resetLevel の後(taken が空なら守護者も退場)
  resetDamageTexts();
  resetFx();
  titleScreen.style.display = 'none';
  gameoverScreen.style.display = 'none';
  levelupScreen.style.display = 'none';
  clearScreen.style.display = 'none';
  hudEl.style.display = 'block';
  startWave(1);
}

function gameOver() {
  state.phase = 'gameover';
  goStats.innerHTML = chapterDef().name + '  WAVE ' + state.wave
    + (state.endless ? '' : ' / ' + chapterDef().waves)
    + ' 到達 / Lv ' + level.lv + '<br>SCORE ' + state.score;
  gameoverScreen.style.display = 'flex';
  hudEl.style.display = 'none';
  joyEnd();
}

// 最終ウェーブを倒しきったとき。ボーナス加算してリザルトを出し、次のチャプターを解放する。
// 'clear' の間は animate() の更新が止まる = ポーズ状態
function chapterClear() {
  state.phase = 'clear';
  const ch = chapterDef();
  clearedChapters = Math.max(clearedChapters, state.chapter + 1);
  saveProgress();
  const hp = Math.ceil(player.hp);
  const bonus = ch.clearBonus + hp * ch.hpBonus;
  state.score += bonus;
  clearPool(arrowPool);
  clearPool(crescentPool);
  clearPool(bulletPool);
  clearArtsFx();                     // 落下中の星・霊剣も掃除(守護者は「このまま続ける」用に残す)
  resetDamageTexts();                // 'clear' 中は animate() が止まるので消し残りを掃除する
  resetFx();
  ccSub.textContent = ch.name + '  ' + ch.subtitle;
  ccStats.innerHTML =
    'WAVE ' + ch.waves + ' 制覇 / Lv ' + level.lv + '<br>' +
    'クリアボーナス +' + ch.clearBonus + '<br>' +
    '残HPボーナス +' + (hp * ch.hpBonus) + '  (HP ' + hp + ')<br>' +
    'SCORE ' + state.score;
  // 次のチャプターがあるときだけ「次のチャプターへ」を出す
  nextBtn.style.display = state.chapter + 1 < CONFIG.chapters.length ? '' : 'none';
  clearScreen.style.display = 'flex';
  hudEl.style.display = 'none';
  joyEnd();
}

// クリア後の「このまま続ける」。以降はウェーブ上限なしで回り続ける
function continueEndless() {
  state.endless = true;
  state.phase = 'playing';
  clearScreen.style.display = 'none';
  hudEl.style.display = 'block';
  player.hp = Math.min(player.maxHp, player.hp + CONFIG.wave.clearHeal);
  startWave(state.wave + 1);
}

function goTitle() {
  while (enemies.length) removeEnemy(enemies[0]);
  clearPool(arrowPool);
  clearPool(crescentPool);
  clearPool(bulletPool);
  clearArtsFx();
  resetFx();
  despawnGuardians();                // タイトルにお供だけ浮いていないように
  state.phase = 'title';
  renderChapterSelect();             // 解放されたチャプターを反映
  clearScreen.style.display = 'none';
  gameoverScreen.style.display = 'none';
  hudEl.style.display = 'none';
  titleScreen.style.display = 'flex';
}

document.getElementById('retry-btn').addEventListener('click', () => startGame(state.chapter));
nextBtn.addEventListener('click', () => startGame(state.chapter + 1));
document.getElementById('endless-btn').addEventListener('click', continueEndless);
document.getElementById('totitle-btn').addEventListener('click', goTitle);
renderChapterSelect();

// 初期カメラ位置
updateCameraProjection();
camera.position.copy(camOffset);
camera.lookAt(0, 0, 0);
animate();
</script>
</body>
