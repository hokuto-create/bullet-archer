name: Deploy to GitHub Pages

# GitHub Pages は gh-pages ブランチから配信される(ブランチ push により自動有効化済み)。
# GITHUB_TOKEN では Pages サイト作成 API を呼べないため、
# main の内容を gh-pages にミラーする方式でデプロイする。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:gh-pages
